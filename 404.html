<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة غير موجودة - متجرنا</title>
    
    <!-- ===== PWA & Favicons (من Root، مفيش ../) ===== -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- ===== Libraries ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ===== Shared Styles ===== -->
    <link rel="stylesheet" href="shared/navbar.css">
    <link rel="stylesheet" href="shared/toast.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --success: #6bcb77;
            --error: #ff4757;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Animated Background ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation .blob:nth-child(2) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -7s;
        }

        .bg-animation .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -14s;
        }

        .bg-animation .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 10%;
            right: 20%;
            animation-delay: -4s;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Floating Icons ===== */
        .floating-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.04);
            font-size: 45px;
            animation: floatIcon 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        .floating-icon:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .floating-icon:nth-child(2) { top: 70%; left: 8%; animation-delay: -2s; }
        .floating-icon:nth-child(3) { top: 20%; right: 12%; animation-delay: -4s; }
        .floating-icon:nth-child(4) { top: 75%; right: 15%; animation-delay: -6s; }
        .floating-icon:nth-child(5) { top: 45%; left: 5%; animation-delay: -1s; font-size: 32px; }
        .floating-icon:nth-child(6) { top: 55%; right: 6%; animation-delay: -3s; font-size: 38px; }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.04; }
            50% { transform: translateY(-30px) rotate(15deg); opacity: 0.08; }
        }

        /* ===== Main Content ===== */
        .main-content {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            min-height: calc(100vh - 90px);
        }

        .error-container {
            text-align: center;
            max-width: 700px;
            width: 100%;
            animation: errorEnter 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes errorEnter {
            0% { opacity: 0; transform: scale(0.8) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ===== 404 Number ===== */
        .error-number {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 5s ease infinite;
            position: relative;
            display: inline-block;
            letter-spacing: -10px;
            text-shadow: 0 0 60px rgba(255, 107, 107, 0.3);
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .error-number span {
            display: inline-block;
            animation: numberBounce 2.5s ease-in-out infinite;
        }

        .error-number span:nth-child(1) { animation-delay: 0s; }
        .error-number span:nth-child(2) { animation-delay: 0.2s; }
        .error-number span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes numberBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* ===== Icon ===== */
        .error-icon {
            font-size: 70px;
            color: var(--primary);
            display: block;
            margin-bottom: 25px;
            animation: iconShake 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 107, 107, 0.5));
        }

        @keyframes iconShake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            50% { transform: rotate(0deg) scale(1); }
            75% { transform: rotate(15deg) scale(1.1); }
        }

        /* ===== Title ===== */
        .error-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Subtitle ===== */
        .error-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.5s both;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== Buttons ===== */
        .error-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.7s both;
        }

        .error-btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .error-btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .error-btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .error-btn-primary:hover::after {
            left: 100%;
        }

        .error-btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 14px 40px rgba(255, 107, 107, 0.6);
        }

        .error-btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .error-btn-outline:hover {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
        }

        /* ===== Quick Links ===== */
        .quick-links {
            animation: fadeInUp 0.8s ease-out 0.9s both;
        }

        .quick-links-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .quick-links-title::before,
        .quick-links-title::after {
            content: '';
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .quick-links-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-link {
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.35s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quick-link:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.4);
            color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.2);
        }

        .quick-link i {
            font-size: 14px;
        }

        /* ===== Footer ===== */
        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 25px 20px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .error-number {
                font-size: 120px;
                letter-spacing: -5px;
            }
            .error-title {
                font-size: 28px;
            }
            .error-subtitle {
                font-size: 15px;
            }
            .error-icon {
                font-size: 55px;
            }
            .error-btn {
                padding: 12px 24px;
                font-size: 14px;
            }
        }

        @media (max-width: 500px) {
            .error-number {
                font-size: 90px;
                letter-spacing: -3px;
            }
            .error-title {
                font-size: 22px;
            }
            .error-subtitle {
                font-size: 14px;
            }
            .error-icon {
                font-size: 45px;
            }
            .error-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .error-btn {
                justify-content: center;
            }
            .floating-icon {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- Floating Icons -->
    <i class="fas fa-search floating-icon"></i>
    <i class="fas fa-exclamation-triangle floating-icon"></i>
    <i class="fas fa-compass floating-icon"></i>
    <i class="fas fa-map-signs floating-icon"></i>
    <i class="fas fa-question floating-icon"></i>
    <i class="fas fa-ghost floating-icon"></i>

    <!-- ⚠️ الـ Navbar هيتبني تلقائياً -->

    <!-- Main Content -->
    <div class="main-content">
        <div class="error-container">

            <!-- Big 404 -->
            <div class="error-number">
                <span>4</span><span>0</span><span>4</span>
            </div>

            <!-- Icon -->
            <i class="fas fa-search-minus error-icon"></i>

            <!-- Title -->
            <h1 class="error-title">الصفحة غير موجودة!</h1>

            <!-- Subtitle -->
            <p class="error-subtitle">
                عذراً، الصفحة اللي بتدور عليها مش موجودة أو اتنقلت لمكان تاني.
                <br>
                تأكد من الرابط أو ارجع للصفحة الرئيسية.
            </p>

            <!-- Buttons -->
            <div class="error-buttons">
                <a href="index.html" class="error-btn error-btn-primary">
                    <i class="fas fa-home"></i>
                    العودة للرئيسية
                </a>
                <a href="Pages/products.html" class="error-btn error-btn-outline">
                    <i class="fas fa-shopping-bag"></i>
                    تصفح المنتجات
                </a>
            </div>

            <!-- Quick Links -->
            <div class="quick-links">
                <div class="quick-links-title">
                    <i class="fas fa-link"></i>
                    روابط سريعة
                </div>
                <div class="quick-links-grid">
                    <a href="Pages/categories.html" class="quick-link">
                        <i class="fas fa-tags"></i>
                        التصنيفات
                    </a>
                    <a href="Pages/cart.html" class="quick-link">
                        <i class="fas fa-shopping-cart"></i>
                        السلة
                    </a>
                    <a href="Pages/wishlist.html" class="quick-link">
                        <i class="fas fa-heart"></i>
                        المفضلة
                    </a>
                    <a href="Pages/about.html" class="quick-link">
                        <i class="fas fa-info-circle"></i>
                        تعرف علينا
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>
            <i class="fas fa-heart"></i>
            جميع الحقوق محفوظة © 2024 متجرنا
        </p>
    </div>

    <!-- ✅ Shared Scripts -->
    <script src="shared/config.js"></script>
    <script src="shared/cart.js"></script>
    <script src="shared/toast.js"></script>
    <script src="shared/navbar.js"></script>

    <script>
        // ===== تسجيل Service Worker =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.warn('⚠️ Service Worker registration failed:', error);
                    });
            });
        }

        // ===== تسجيل الصفحة في Console =====
        console.log('%c❌ 404 Page Loaded', 'color: #ff4757; font-size: 20px; font-weight: bold;');
        console.log('%c🔗 المسار المطلوب:', 'color: #ffd93d; font-size: 14px;', window.location.pathname);
    </script>

</body>
</html>
