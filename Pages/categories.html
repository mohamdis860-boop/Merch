<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التصنيفات - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    
    <!-- ✅ Shared Styles (مسار من Pages/) -->
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Animated Colorful Background ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation .blob:nth-child(2) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -7s;
        }

        .bg-animation .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -14s;
        }

        .bg-animation .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%;
            right: 20%;
            animation-delay: -4s;
        }

        .bg-animation .blob:nth-child(5) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%;
            left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Main Content ===== */
        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(6px);
        }

        .back-btn i {
            transition: 0.35s;
        }

        .back-btn:hover i {
            transform: translateX(4px);
        }

        /* ===== Page Header ===== */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header .tags-icon-big {
            font-size: 60px;
            color: var(--primary);
            display: block;
            margin-bottom: 15px;
            animation: tagsBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5));
        }

        @keyframes tagsBounce {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-12px) rotate(-6deg) scale(1.08); }
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== Categories Grid ===== */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px 25px;
            transition:
                transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease,
                background 0.4s ease,
                border-color 0.4s ease;
            animation: cardSlideUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.08), transparent, rgba(108, 92, 231, 0.08), transparent);
            animation: rotateGlow 10s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .category-card:hover::before {
            opacity: 1;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .category-card:hover {
            transform: translateY(-15px) scale(1.03);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(255, 107, 107, 0.25);
            z-index: 10;
        }

        .category-card .category-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            transition: 0.5s;
            position: relative;
            z-index: 1;
        }

        .category-card:nth-child(6n+1) .category-icon { color: #ff6b6b; filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.5)); }
        .category-card:nth-child(6n+2) .category-icon { color: #6c5ce7; filter: drop-shadow(0 0 12px rgba(108, 92, 231, 0.5)); }
        .category-card:nth-child(6n+3) .category-icon { color: #00cec9; filter: drop-shadow(0 0 12px rgba(0, 206, 201, 0.5)); }
        .category-card:nth-child(6n+4) .category-icon { color: #fd79a8; filter: drop-shadow(0 0 12px rgba(253, 121, 168, 0.5)); }
        .category-card:nth-child(6n+5) .category-icon { color: #ffd93d; filter: drop-shadow(0 0 12px rgba(255, 217, 61, 0.5)); }
        .category-card:nth-child(6n+6) .category-icon { color: #a29bfe; filter: drop-shadow(0 0 12px rgba(162, 155, 254, 0.5)); }

        .category-card:hover .category-icon {
            transform: scale(1.25) rotate(-8deg);
        }

        .category-card h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }

        .category-card:hover h3 {
            color: var(--secondary);
        }

        .category-card .category-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }

        .category-card:hover .category-desc {
            color: rgba(255, 255, 255, 0.75);
        }

        .category-card .product-count {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }

        .category-card:hover .product-count {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        .category-card .product-count i {
            margin-right: 4px;
        }

        .category-card .category-id {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .category-card .click-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 12px;
            transition: 0.35s;
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .category-card:hover .click-hint {
            color: var(--primary);
        }

        .category-card .click-hint i {
            transition: 0.4s;
        }

        .category-card:hover .click-hint i {
            transform: translateX(-5px);
        }

        /* ===== Loading Spinner ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            gap: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        .loading-spinner i {
            animation: spin 1s linear infinite;
            font-size: 32px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.6));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* ===== Footer ===== */
        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 30px;
            }
            .main-content {
                padding: 30px 15px;
            }
            .categories-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
            .page-header h1 {
                font-size: 24px;
            }
            .page-header .tags-icon-big {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Colorful Background -->
    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- ⚠️ الـ Navbar هيتبني تلقائياً بالـ JavaScript -->

    <!-- Main Content -->
    <div class="main-content">

        <a href="../index.html" class="back-btn" data-aos="fade-left">
            <i class="fas fa-arrow-right"></i>
            العودة للرئيسية
        </a>

        <div class="page-header" data-aos="fade-down">
            <i class="fas fa-tags tags-icon-big"></i>
            <h1>التصنيفات</h1>
            <p>اختر تصنيفاً لتصفح المنتجات</p>
        </div>

        <div id="categoriesContainer">
    <div class="skeleton-categories-grid">
        <div class="skeleton-category-card">
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-desc"></div>
            <div class="skeleton skeleton-count"></div>
        </div>
        <div class="skeleton-category-card">
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-desc"></div>
            <div class="skeleton skeleton-count"></div>
        </div>
        <div class="skeleton-category-card">
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-desc"></div>
            <div class="skeleton skeleton-count"></div>
        </div>
        <div class="skeleton-category-card">
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-desc"></div>
            <div class="skeleton skeleton-count"></div>
        </div>
        <div class="skeleton-category-card">

            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-desc"></div>
            <div class="skeleton skeleton-count"></div>
        </div>
        <div class="skeleton-category-card">
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-desc"></div>
            <div class="skeleton skeleton-count"></div>
        </div>
    </div>
</div>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true,
            offset: 100
        });
    </script>

    <!-- ✅ Shared Scripts (الترتيب مهم!) -->
    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../shared/footer.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            const categoriesContainer = document.getElementById('categoriesContainer');

            // ===== أدوات مساعدة =====
            function safeToString(value) {
                if (value === null || value === undefined) return '';
                return String(value);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getCategoryIcon(index) {
                const icons = [
                    'fa-layer-group', 'fa-tag', 'fa-cube', 'fa-boxes',
                    'fa-th-large', 'fa-list', 'fa-grip', 'fa-table',
                    'fa-border-all', 'fa-square', 'fa-circle', 'fa-gem',
                    'fa-star', 'fa-heart', 'fa-crown', 'fa-fire'
                ];
                return icons[index % icons.length];
            }

            function goToCategoryProducts(categoryId, categoryName, categoryDesc) {
                window.showToast(`📂 جاري تحميل منتجات "${categoryName}"...`, 'info');

                setTimeout(() => {
                    window.location.href = `category-products.html?id=${encodeURIComponent(categoryId)}&name=${encodeURIComponent(categoryName)}&desc=${encodeURIComponent(categoryDesc || '')}`;
                }, 400);
            }

            // ===== إنشاء كارت تصنيف =====
            function createCategoryCard(item, index, productCounts) {
                const categoryName = safeToString(item.Category_Name) || 'بدون اسم';
                const description = safeToString(item.Description) || 'لا يوجد وصف';
                const categoryId = item.Category_ID ?? item.id ?? null;

                if (categoryId === null) {
                    console.warn('⚠️ تصنيف بدون ID:', item);
                    return null;
                }

                const icon = getCategoryIcon(index);
                const productCount = productCounts[categoryId] || 0;

                const card = document.createElement('div');
                card.className = 'category-card';
                card.style.animationDelay = `${index * 0.08}s`;
                card.setAttribute('data-aos', 'zoom-in-up');
                card.setAttribute('data-aos-delay', String(Math.min(index * 50, 400)));
                card.dataset.id = String(categoryId);
                card.dataset.name = categoryName;
                card.dataset.desc = description;

                // الأيقونة
                const iconEl = document.createElement('i');
                iconEl.className = `fas ${icon} category-icon`;

                // العنوان
                const title = document.createElement('h3');
                title.textContent = categoryName;

                // الوصف
                const descEl = document.createElement('p');
                descEl.className = 'category-desc';
                descEl.textContent = description;

                // عدد المنتجات
                const countEl = document.createElement('span');
                countEl.className = 'product-count';
                countEl.innerHTML = `<i class="fas fa-box"></i> ${productCount} منتج`;

                // ID
                const idEl = document.createElement('span');
                idEl.className = 'category-id';
                idEl.textContent = `#${categoryId}`;

                // Hint
                const hintEl = document.createElement('div');
                hintEl.className = 'click-hint';
                hintEl.innerHTML = `<i class="fas fa-arrow-left"></i> اضغط للتصفح`;

                card.appendChild(iconEl);
                card.appendChild(title);
                card.appendChild(descEl);
                card.appendChild(countEl);
                card.appendChild(idEl);
                card.appendChild(hintEl);

                // حدث النقر
                card.addEventListener('click', function() {
                    goToCategoryProducts(
                        this.dataset.id,
                        this.dataset.name,
                        this.dataset.desc
                    );
                });

                return card;
            }

            // ===== تحميل التصنيفات =====
            async function loadCategories() {
                try {
                    // تحميل التصنيفات والمنتجات بالتوازي
                    const [catRes, prodRes] = await Promise.all([
                        supabase.from('Category').select('*'),
                        supabase.from('Product').select('Category_ID')
                    ]);

                    if (catRes.error) throw new Error(catRes.error.message);
                    if (prodRes.error) throw new Error(prodRes.error.message);

                    const categories = catRes.data || [];
                    const products = prodRes.data || [];

                    console.log('✅ تم تحميل التصنيفات:', categories);

                    // حساب عدد المنتجات لكل تصنيف
                    const productCounts = products.reduce((acc, p) => {
                        if (p.Category_ID) {
                            acc[p.Category_ID] = (acc[p.Category_ID] || 0) + 1;
                        }
                        return acc;
                    }, {});

                    if (categories.length === 0) {
                        categoriesContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-folder-open"></i>
                                <p>لا توجد تصنيفات حالياً</p>
                            </div>
                        `;
                        return;
                    }

                    // بناء الشبكة
                    const grid = document.createElement('div');
                    grid.className = 'categories-grid';

                    categories.forEach((item, index) => {
                        const card = createCategoryCard(item, index, productCounts);
                        if (card) grid.appendChild(card);
                    });

                    categoriesContainer.innerHTML = '';
                    categoriesContainer.appendChild(grid);

                    // تحديث AOS
                    if (window.AOS && typeof AOS.refresh === 'function') {
                        AOS.refresh();
                    }

                } catch (error) {
                    console.error('❌ خطأ:', error);
                    categoriesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">${escapeHtml(error.message)}</p>
                        </div>
                    `;
                }
            }

            loadCategories();

            console.log('%c🏷️ Categories page loaded', 'color: #ff6b6b; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
