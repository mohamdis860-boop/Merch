<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    
    <!-- ✅ Shared Styles (مسار من Pages/) -->
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --success: #6bcb77;
            --error: #ff4757;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Animated Background ===== */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }
        .bg-animation .blob:nth-child(4) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%; right: 20%;
            animation-delay: -4s;
        }
        .bg-animation .blob:nth-child(5) {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%; left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Main Content ===== */
        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 25px;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(6px);
        }

        /* ===== Loading ===== */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            gap: 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .loading-screen i {
            font-size: 45px;
            color: var(--primary);
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 15px rgba(255, 107, 107, 0.6));
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Product Layout ===== */
        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 60px;
        }

        /* Image */
        .product-image-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.06), transparent, rgba(108, 92, 231, 0.06), transparent);
            animation: rotateGlow 15s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .no-image-big {
            font-size: 120px;
            color: rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* ===== Swiper Gallery ===== */
        .product-swiper {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            position: relative;
            z-index: 1;
        }

        .product-swiper .swiper-wrapper { align-items: center; }

        .product-swiper .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
        }

        .product-swiper .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .product-swiper .swiper-slide:hover img { transform: scale(1.05); }

        .product-swiper .swiper-button-prev,
        .product-swiper .swiper-button-next {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: 0.35s;
        }

        .product-swiper .swiper-button-prev:hover,
        .product-swiper .swiper-button-next:hover {
            background: linear-gradient(135deg, var(--primary), #ee5a24);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .product-swiper .swiper-button-prev::after,
        .product-swiper .swiper-button-next::after {
            font-size: 16px;
            font-weight: 900;
        }

        .product-swiper .swiper-pagination-bullet {
            background: rgba(255, 255, 255, 0.4);
            opacity: 1;
            width: 8px; height: 8px;
            transition: 0.35s;
        }

        .product-swiper .swiper-pagination-bullet-active {
            background: var(--primary);
            width: 24px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
        }

        /* Product Info */
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-breadcrumb {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .product-breadcrumb a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: 0.3s;
        }

        .product-breadcrumb a:hover { color: var(--primary); }

        .product-name {
            font-size: 34px;
            font-weight: 900;
            line-height: 1.3;
            background: linear-gradient(135deg, #fff, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stars-row {
            display: flex;
            gap: 3px;
            font-size: 18px;
        }

        .stars-row .star {
            color: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        .stars-row .star.filled {
            color: var(--secondary);
            filter: drop-shadow(0 0 6px rgba(255, 217, 61, 0.6));
        }

        .rating-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .rating-text strong {
            color: var(--secondary);
            font-size: 16px;
        }

        /* Meta Info */
        .product-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            transition: 0.35s;
        }

        .meta-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .meta-badge i { color: var(--primary); }

        .meta-badge.available {
            background: rgba(107, 203, 119, 0.12);
            border-color: rgba(107, 203, 119, 0.3);
            color: var(--success);
        }

        .meta-badge.available i { color: var(--success); }

        .meta-badge.unavailable {
            background: rgba(255, 71, 87, 0.12);
            border-color: rgba(255, 71, 87, 0.3);
            color: var(--error);
        }

        .meta-badge.unavailable i { color: var(--error); }

        /* Price */
        .price-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .price-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            display: block;
            margin-bottom: 4px;
        }

        .price-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
        }

        /* Description */
        .description-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
        }

        .description-box h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .description-box p {
            font-size: 15px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.75);
            white-space: pre-wrap;
        }

        /* Quantity + Buttons */
        .actions-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 4px;
            gap: 6px;
        }

        .quantity-selector button {
            width: 40px; height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.35s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-selector button:hover {
            background: linear-gradient(135deg, var(--primary), #ee5a24);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .quantity-selector span {
            font-size: 18px;
            font-weight: 800;
            min-width: 40px;
            text-align: center;
            color: var(--secondary);
        }

        .add-to-cart-btn {
            flex: 1;
            min-width: 200px;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .add-to-cart-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .wishlist-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 22px;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wishlist-btn:hover {
            background: rgba(253, 121, 168, 0.15);
            border-color: var(--accent3);
            color: var(--accent3);
            transform: scale(1.1) rotate(-8deg);
        }

        .wishlist-btn.active {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            border-color: transparent;
            color: white;
            box-shadow: 0 8px 25px rgba(253, 121, 168, 0.5);
        }

        /* Reviews Section */
        .reviews-section {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i { color: var(--primary); }

        .section-title .count {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 30px;
            margin-right: auto;
        }

        .add-review-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .add-review-box h4 {
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-review-box h4 i { color: var(--secondary); }

        .rating-input {
            display: flex;
            gap: 5px;
            font-size: 28px;
            margin-bottom: 15px;
            direction: rtl;
        }

        .rating-input i {
            color: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: 0.25s;
        }

        .rating-input i:hover,
        .rating-input i.active {
            color: var(--secondary);
            transform: scale(1.15);
        }

        .comment-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 18px;
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            resize: vertical;
            min-height: 80px;
            outline: none;
        }

        .comment-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.2);
        }

        .submit-review-btn {
            margin-top: 15px;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .login-prompt {
            background: rgba(108, 92, 231, 0.1);
            border: 1px dashed rgba(108, 92, 231, 0.4);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-prompt i {
            font-size: 40px;
            color: var(--accent);
            margin-bottom: 12px;
            display: block;
        }

        .login-prompt a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            transition: 0.4s;
        }

        .review-card:hover {
            transform: translateX(6px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 107, 107, 0.2);
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .review-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
        }

        .review-author h5 {
            font-size: 15px;
            font-weight: 700;
        }

        .review-author span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .review-stars {
            display: flex;
            gap: 2px;
            font-size: 14px;
        }

        .review-stars i { color: rgba(255, 255, 255, 0.2); }
        .review-stars i.filled { color: var(--secondary); }

        .review-comment {
            font-size: 14px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.75);
        }

        .empty-reviews {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-reviews i {
            font-size: 60px;
            color: rgba(255, 255, 255, 0.08);
            margin-bottom: 15px;
            display: block;
        }

        /* Similar Products */
        .similar-section {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .similar-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            transition:
                transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease,
                background 0.4s ease,
                border-color 0.4s ease;
            text-decoration: none;
            color: white;
            animation: cardSlideUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            will-change: transform;
        }

        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .similar-card:hover {
            transform: translateY(-15px) scale(1.03);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(255, 107, 107, 0.25);
            z-index: 10;
        }

        .similar-card .img-wrapper {
            width: 100%;
            height: 160px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .similar-card .img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: 0.5s;
        }

        .similar-card:hover .img-wrapper img { transform: scale(1.1); }

        .similar-card .img-wrapper .no-image {
            font-size: 50px;
            color: rgba(255, 255, 255, 0.1);
        }

        .similar-card h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.4;
            transition: 0.4s;
        }

        .similar-card:hover h4 { color: var(--secondary); }

        .similar-card .similar-price {
            font-size: 17px;
            font-weight: 800;
            color: var(--secondary);
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 100px 20px;
        }

        .error-state i {
            font-size: 80px;
            color: var(--error);
            margin-bottom: 20px;
            display: block;
        }

        .error-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--error);
        }

        .error-state a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .footer i { color: var(--primary); }

        /* Responsive */
        @media (max-width: 900px) {
            .product-layout {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        @media (max-width: 768px) {
            .main-content { padding: 20px 15px 40px; }
            .product-name { font-size: 24px; }
            .price-value { font-size: 26px; }
            .actions-row { flex-direction: column; align-items: stretch; }
            .wishlist-btn { width: 100%; height: 50px; }
            .similar-grid { grid-template-columns: 1fr 1fr; }
            .product-swiper .swiper-button-prev,
            .product-swiper .swiper-button-next {
                width: 36px;
                height: 36px;
            }
        }

        @media (max-width: 500px) {
            .similar-grid { grid-template-columns: 1fr; }
            .review-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

        </p>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true,
            offset: 100
        });
    </script>

    <!-- ✅ Shared Scripts (الترتيب مهم!) -->
    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            let currentUser = null;
            let currentProduct = null;
            let currentQuantity = 1;
            let selectedRating = 0;
            let currentCategoryName = '';
            let productSwiper = null;

            const loadingScreen = document.getElementById('loadingScreen');
            const errorState = document.getElementById('errorState');
            const productContent = document.getElementById('productContent');

            // ===== أدوات مساعدة =====
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getProductId() {
                const params = new URLSearchParams(window.location.search);
                return params.get('id');
            }

            function formatPrice(price) {
                return Number(price || 0).toLocaleString('en-US') + ' ج.م';
            }

            function getStarsHTML(rating) {
                let html = '';
                for (let i = 1; i <= 5; i++) {
                    html += `<i class="fas fa-star star ${i <= Math.round(rating) ? 'filled' : ''}"></i>`;
                }
                return html;
            }

            // ===== المفضلة =====
            function getWishlist() {
                return JSON.parse(localStorage.getItem('wishlist')) || [];
            }

            function isInWishlist(productId) {
                return getWishlist().some(id => String(id) === String(productId));
            }

            function toggleWishlist(productId) {
                let wishlist = getWishlist();
                const strId = String(productId);

                if (wishlist.includes(strId)) {
                    wishlist = wishlist.filter(id => id !== strId);
                    localStorage.setItem('wishlist', JSON.stringify(wishlist));
                    return false;
                } else {
                    wishlist.push(strId);
                    localStorage.setItem('wishlist', JSON.stringify(wishlist));
                    return true;
                }
            }

            // ===== تحميل بيانات المستخدم =====
            async function loadCurrentUser() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    currentUser = session?.user || null;
                } catch (err) {
                    console.warn('⚠️ Could not load user:', err);
                }
            }

            // ===== تحميل المنتج =====
            async function loadProduct() {
                await loadCurrentUser();

                const productId = getProductId();

                if (!productId) {
                    showError();
                    return;
                }

                try {
                    const { data: product, error } = await supabase
                        .from('Product')
                        .select('*')
                        .eq('Product_ID', parseInt(productId))
                        .single();

                    if (error || !product) {
                        console.error('Product error:', error);
                        showError();
                        return;
                    }

                    currentProduct = product;

                    if (product.Category_ID) {
                        const { data: category } = await supabase
                            .from('Category')
                            .select('Category_Name')
                            .eq('Category_ID', product.Category_ID)
                            .single();

                        if (category) currentCategoryName = category.Category_Name;
                    }

                    renderProduct();
                    loadReviews();
                    loadSimilarProducts();

                    loadingScreen.style.display = 'none';
                    productContent.style.display = 'block';

                } catch (err) {
                    console.error('❌ Error:', err);
                    showError();
                }
            }

            function showError() {
                loadingScreen.style.display = 'none';
                errorState.style.display = 'block';
            }

            function renderProduct() {
                const p = currentProduct;

                // ===== Swiper Gallery =====
                const swiperWrapper = document.getElementById('swiperWrapper');
                const imgUrl = window.getImageUrl(p.Image_URL);

                if (imgUrl) {
                    swiperWrapper.innerHTML = `
                        <div class="swiper-slide">
                            <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(p.Product_Name)}">
                        </div>
                    `;
                } else {
                    swiperWrapper.innerHTML = `
                        <div class="swiper-slide">
                            <i class="fas fa-image no-image-big"></i>
                        </div>
                    `;
                }

                setTimeout(() => {
                    if (productSwiper) {
                        productSwiper.destroy(true, true);
                    }

                    productSwiper = new Swiper('.product-swiper', {
                        loop: false,
                        spaceBetween: 10,
                        pagination: {
                            el: '.swiper-pagination',
                            clickable: true,
                        },
                        navigation: {
                            nextEl: '.swiper-button-next',
                            prevEl: '.swiper-button-prev',
                        },
                        effect: 'slide',
                        speed: 400,
                    });
                }, 100);

                document.getElementById('breadcrumbName').textContent = p.Product_Name || 'منتج';
                document.getElementById('productName').textContent = p.Product_Name || 'بدون اسم';

                document.getElementById('ratingStars').innerHTML = getStarsHTML(p.Rating || 0);
                document.getElementById('ratingValue').textContent = Number(p.Rating || 0).toFixed(1);
                document.getElementById('ratingCount').textContent = `${p.Review_Count || 0} مراجعة`;

                const statusAvailable = (p.Status || '').toLowerCase() === 'available' || (p.Status || '').toLowerCase() === 'active' || !p.Status;
                const metaHTML = `
                    ${currentCategoryName ? `
                        <span class="meta-badge">
                            <i class="fas fa-tags"></i>
                            ${escapeHtml(currentCategoryName)}
                        </span>
                    ` : ''}
                    ${p.Unit ? `
                        <span class="meta-badge">
                            <i class="fas fa-cube"></i>
                            ${escapeHtml(p.Unit)}
                        </span>
                    ` : ''}
                    <span class="meta-badge ${statusAvailable ? 'available' : 'unavailable'}">
                        <i class="fas fa-${statusAvailable ? 'check-circle' : 'times-circle'}"></i>
                        ${statusAvailable ? 'متاح' : 'غير متاح'}
                    </span>
                `;
                document.getElementById('productMeta').innerHTML = metaHTML;

                document.getElementById('productPrice').textContent = formatPrice(p.Selling_Price);
                document.getElementById('productCode').textContent = '#' + (p.Product_ID || '—');

                const desc = p.Description && p.Description.trim() !== ''
                    ? p.Description
                    : 'لا يوجد وصف تفصيلي لهذا المنتج.';
                document.getElementById('productDescription').textContent = desc;

                currentQuantity = 1;
                document.getElementById('quantityValue').textContent = currentQuantity;

                const wishlistBtn = document.getElementById('wishlistBtn');
                if (isInWishlist(p.Product_ID)) {
                    wishlistBtn.classList.add('active');
                    wishlistBtn.innerHTML = '<i class="fas fa-heart"></i>';
                } else {
                    wishlistBtn.classList.remove('active');
                    wishlistBtn.innerHTML = '<i class="far fa-heart"></i>';
                }

                const addBtn = document.getElementById('addToCartBtn');
                if (!statusAvailable) {
                    addBtn.disabled = true;
                    addBtn.querySelector('span').textContent = 'غير متاح';
                }
            }

            document.getElementById('increaseQty').addEventListener('click', () => {
                if (currentQuantity < 99) {
                    currentQuantity++;
                    document.getElementById('quantityValue').textContent = currentQuantity;
                }
            });

            document.getElementById('decreaseQty').addEventListener('click', () => {
                if (currentQuantity > 1) {
                    currentQuantity--;
                    document.getElementById('quantityValue').textContent = currentQuantity;
                }
            });

            document.getElementById('addToCartBtn').addEventListener('click', function() {
                const statusAvailable = (currentProduct.Status || '').toLowerCase() === 'available' || (currentProduct.Status || '').toLowerCase() === 'active' || !currentProduct.Status;
                if (!statusAvailable) {
                    window.showToast('❌ المنتج غير متاح حالياً', 'error');
                    return;
                }

                // ✅ استخدم الدالة الموحّدة من shared/cart.js
                // نضيف الكمية المحددة
                for (let i = 0; i < currentQuantity; i++) {
                    window.addToCartItem(
                        currentProduct.Product_ID,
                        currentProduct.Product_Name,
                        parseFloat(currentProduct.Selling_Price) || 0,
                        currentProduct.Image_URL || ''
                    );
                }

                const btn = this;
                const originalText = btn.querySelector('span').textContent;
                btn.querySelector('span').textContent = '✓ تمت الإضافة';
                btn.style.background = 'linear-gradient(135deg, #6bcb77, #4caf50)';
                setTimeout(() => {
                    btn.querySelector('span').textContent = originalText;
                    btn.style.background = '';
                }, 1500);
            });

            document.getElementById('wishlistBtn').addEventListener('click', function() {
                const added = toggleWishlist(currentProduct.Product_ID);

                if (added) {
                    this.classList.add('active');
                    this.innerHTML = '<i class="fas fa-heart"></i>';
                    window.showToast('❤️ تم إضافة المنتج للمفضلة', 'success');
                } else {
                    this.classList.remove('active');
                    this.innerHTML = '<i class="far fa-heart"></i>';
                    window.showToast('💔 تم إزالة المنتج من المفضلة', 'info');
                }
            });

            // ===== المراجعات =====
            async function loadReviews() {
                const productId = currentProduct.Product_ID;

                try {
                    const { data: reviews, error } = await supabase
                        .from('Reviews')
                        .select('*')
                        .eq('product_id', productId)
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    renderReviewForm();
                    renderReviews(reviews || []);

                } catch (err) {
                    console.error('Reviews error:', err);
                    renderReviewForm();
                    renderReviews([]);
                }
            }

            function renderReviewForm() {
                const container = document.getElementById('reviewFormContainer');

                if (!currentUser) {
                    container.innerHTML = `
                        <div class="login-prompt">
                            <i class="fas fa-lock"></i>
                            <p>لازم تسجّل دخول عشان تكتب مراجعة</p>
                            <a href="../Auth/login.html">
                                <i class="fas fa-sign-in-alt"></i>
                                تسجيل الدخول
                            </a>
                        </div>
                    `;
                    return;
                }

                supabase
                    .from('Reviews')
                    .select('review_id')
                    .eq('product_id', currentProduct.Product_ID)
                    .eq('customer_id', currentUser.id)
                    .maybeSingle()
                    .then(({ data }) => {
                        if (data) {
                            container.innerHTML = `
                                <div class="login-prompt" style="background: rgba(107, 203, 119, 0.1); border-color: rgba(107, 203, 119, 0.4);">
                                    <i class="fas fa-check-circle" style="color: var(--success);"></i>
                                    <p>لقد قمت بتقييم هذا المنتج بالفعل</p>
                                </div>
                            `;
                        } else {
                            container.innerHTML = `
                                <div class="add-review-box">
                                    <h4>
                                        <i class="fas fa-pen"></i>
                                        اكتب مراجعتك
                                    </h4>
                                    <div class="rating-input" id="ratingInput">
                                        <i class="fas fa-star" data-rating="1"></i>
                                        <i class="fas fa-star" data-rating="2"></i>
                                        <i class="fas fa-star" data-rating="3"></i>
                                        <i class="fas fa-star" data-rating="4"></i>
                                        <i class="fas fa-star" data-rating="5"></i>
                                    </div>
                                    <textarea 
                                        class="comment-input" 
                                        id="commentInput" 
                                        placeholder="شاركنا تجربتك مع المنتج..."
                                        maxlength="500"
                                    ></textarea>
                                    <button class="submit-review-btn" id="submitReviewBtn">
                                        <i class="fas fa-paper-plane"></i>
                                        إرسال المراجعة
                                    </button>
                                </div>
                            `;

                            attachReviewEvents();
                        }
                    });
            }

            function attachReviewEvents() {
                const stars = document.querySelectorAll('#ratingInput i');
                stars.forEach(star => {
                    star.addEventListener('mouseenter', function() {
                        const r = parseInt(this.dataset.rating);
                        stars.forEach((s, i) => {
                            s.classList.toggle('active', i < r);
                        });
                    });

                    star.addEventListener('click', function() {
                        selectedRating = parseInt(this.dataset.rating);
                        stars.forEach((s, i) => {
                            s.classList.toggle('active', i < selectedRating);
                        });
                    });
                });

                document.getElementById('ratingInput').addEventListener('mouseleave', () => {
                    stars.forEach((s, i) => {
                        s.classList.toggle('active', i < selectedRating);
                    });
                });

                document.getElementById('submitReviewBtn').addEventListener('click', submitReview);
            }

            async function submitReview() {
                const comment = document.getElementById('commentInput').value.trim();
                const btn = document.getElementById('submitReviewBtn');

                if (selectedRating === 0) {
                    window.showToast('❌ اختر تقييم من 1 إلى 5 نجوم', 'error');
                    return;
                }

                if (!comment) {
                    window.showToast('❌ اكتب مراجعتك الأول', 'error');
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري الإرسال...';

                try {
                    const { error } = await supabase
                        .from('Reviews')
                        .insert({
                            product_id: currentProduct.Product_ID,
                            customer_id: currentUser.id,
                            rating: selectedRating,
                            comment: comment
                        });

                    if (error) throw error;

                    window.showToast('✅ تم إرسال مراجعتك بنجاح', 'success');

                    await new Promise(r => setTimeout(r, 800));

                    const { data: updatedProduct } = await supabase
                        .from('Product')
                        .select('Rating, Review_Count')
                        .eq('Product_ID', currentProduct.Product_ID)
                        .single();

                    if (updatedProduct) {
                        currentProduct.Rating = updatedProduct.Rating;
                        currentProduct.Review_Count = updatedProduct.Review_Count;
                        document.getElementById('ratingStars').innerHTML = getStarsHTML(updatedProduct.Rating || 0);
                        document.getElementById('ratingValue').textContent = Number(updatedProduct.Rating || 0).toFixed(1);
                        document.getElementById('ratingCount').textContent = `${updatedProduct.Review_Count || 0} مراجعة`;
                    }

                    loadReviews();

                } catch (error) {
                    console.error('❌ Review error:', error);
                    window.showToast('❌ ' + error.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال المراجعة';
                }
            }

            function renderReviews(reviews) {
                const list = document.getElementById('reviewsList');
                document.getElementById('reviewsCountTitle').textContent = reviews.length;

                if (reviews.length === 0) {
                    list.innerHTML = `
                        <div class="empty-reviews">
                            <i class="fas fa-comment-slash"></i>
                            <h3>لا توجد مراجعات بعد</h3>
                            <p>كن أول من يشارك تجربته مع هذا المنتج</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                reviews.forEach((review, index) => {
                    const starsHTML = Array.from({ length: 5 }, (_, i) =>
                        `<i class="fas fa-star ${i < review.rating ? 'filled' : ''}"></i>`
                    ).join('');

                    const date = new Date(review.created_at).toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    html += `
                        <div class="review-card" style="animation-delay: ${index * 0.05}s">
                            <div class="review-header">
                                <div class="review-avatar" data-customer-id="${review.customer_id}">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div class="review-author">
                                    <h5 class="review-name" data-customer-id="${review.customer_id}">جاري التحميل...</h5>
                                    <span><i class="far fa-clock"></i> ${date}</span>
                                </div>
                                <div class="review-stars">
                                    ${starsHTML}
                                </div>
                            </div>
                            <p class="review-comment">${escapeHtml(review.comment)}</p>
                        </div>
                    `;
                });

                list.innerHTML = html;

                fetchCustomerNames(reviews.map(r => r.customer_id));
            }

            async function fetchCustomerNames(customerIds) {
                if (!customerIds || customerIds.length === 0) return;

                try {
                    const { data: customers } = await supabase
                        .from('Customers')
                        .select('id, Name')
                        .in('id', customerIds);

                    if (customers) {
                        customers.forEach(c => {
                            document.querySelectorAll(`.review-name[data-customer-id="${c.id}"]`).forEach(el => {
                                el.textContent = c.Name || 'عميل';
                            });
                            document.querySelectorAll(`.review-avatar[data-customer-id="${c.id}"]`).forEach(el => {
                                el.textContent = (c.Name || 'ع').charAt(0).toUpperCase();
                            });
                        });
                    }
                } catch (err) {
                    console.warn('Could not fetch customer names:', err);
                }
            }

            // ===== المنتجات المشابهة =====
            async function loadSimilarProducts() {
                if (!currentProduct.Category_ID) return;

                try {
                    const { data: products, error } = await supabase
                        .from('Product')
                        .select('Product_ID, Product_Name, Selling_Price, Image_URL')
                        .eq('Category_ID', currentProduct.Category_ID)
                        .neq('Product_ID', currentProduct.Product_ID)
                        .limit(4);

                    if (error) throw error;

                    const grid = document.getElementById('similarGrid');

                    if (!products || products.length === 0) {
                        grid.innerHTML = `
                            <div style="grid-column: 1/-1; text-align: center; padding: 30px; color: rgba(255,255,255,0.4);">
                                <i class="fas fa-box-open" style="font-size: 40px; margin-bottom: 10px; display: block;"></i>
                                لا توجد منتجات مشابهة
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    products.forEach((p, index) => {
                        const imgUrl = window.getImageUrl(p.Image_URL);
                        html += `
                            <a href="product-details.html?id=${p.Product_ID}" 
                               class="similar-card" 
                               style="animation-delay: ${index * 0.1}s">
                                <div class="img-wrapper">
                                    ${imgUrl ? 
                                        `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(p.Product_Name)}">` :
                                        `<i class="fas fa-image no-image"></i>`
                                    }
                                </div>
                                <h4>${escapeHtml(p.Product_Name)}</h4>
                                <div class="similar-price">
                                    ${formatPrice(p.Selling_Price)}
                                </div>
                            </a>
                        `;
                    });

                    grid.innerHTML = html;

                } catch (err) {
                    console.error('Similar products error:', err);
                }
            }

            loadProduct();

            console.log('%c📦 Product Details page loaded', 'color: #ff6b6b; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
</html>
