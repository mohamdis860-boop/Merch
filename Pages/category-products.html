<!-- ==================== category-products.html (نسخة معدلة مع AOS + تأثير hover) ==================== -->
<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجات التصنيف - متجرنا</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Animated Colorful Background ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation .blob:nth-child(2) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -7s;
        }

        .bg-animation .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -14s;
        }

        .bg-animation .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%;
            right: 20%;
            animation-delay: -4s;
        }

        .bg-animation .blob:nth-child(5) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%;
            left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Navbar ===== */
        .navbar {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 26, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            animation: slideDown 0.7s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .navbar .logo {
            font-size: 28px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            text-decoration: none;
            transition: 0.4s;
        }

        .navbar .logo:hover {
            transform: scale(1.05);
        }

        .navbar .logo i {
            color: var(--primary);
            font-size: 32px;
            animation: logoPulse 2.5s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255, 107, 107, 0.5)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 18px rgba(255, 107, 107, 0.9)); }
        }

        .navbar .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .navbar .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.35s;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            padding: 4px 0;
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.35s ease;
            border-radius: 2px;
        }

        .navbar .nav-links a:hover::after,
        .navbar .nav-links a.active::after {
            width: 100%;
        }

        .navbar .nav-links a:hover {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .navbar .nav-links a.active {
            color: var(--primary);
        }

        /* ===== عداد السلة ===== */
        .cart-badge {
            position: relative;
        }

        .cart-badge .badge-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: linear-gradient(135deg, var(--primary), #ee5a24);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.5);
            animation: badgePop 0.4s ease-out;
        }

        @keyframes badgePop {
            0% { transform: scale(0); }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* ===== Main Content ===== */
        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(-6px);
        }

        .back-btn i {
            transition: 0.35s;
        }

        .back-btn:hover i {
            transform: translateX(-4px);
        }

        /* ===== Page Header ===== */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header .category-icon-big {
            font-size: 60px;
            color: var(--primary);
            display: block;
            margin-bottom: 15px;
            animation: categoryIconBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5));
        }

        @keyframes categoryIconBounce {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-12px) rotate(-8deg) scale(1.08); }
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
        }

        .page-header .category-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            transition: 0.4s;
        }

        .page-header .category-id-badge:hover {
            background: rgba(255, 107, 107, 0.3);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        /* ===== Product Grid ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px 20px 25px;
            transition: 
                transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease,
                background 0.4s ease,
                border-color 0.4s ease;
            animation: cardSlideUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        /* 🎬 أنيميشن دخول الكارت */
        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.06), transparent, rgba(108, 92, 231, 0.06), transparent);
            animation: rotateGlow 12s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 🖱️ تأثير hover: الكارت يطلع لفوق */
        .product-card:hover {
            transform: translateY(-15px) scale(1.03);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.4), 
                0 0 40px rgba(255, 107, 107, 0.25);
            z-index: 10;
        }

        .product-card .product-image {
            width: 100%;
            height: 200px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: 0.5s;
        }

        .product-card .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .product-card:hover .product-image img {
            transform: scale(1.1);
        }

        /* تأثيرات الصور المتنوعة */
        .product-card .product-image.floating {
            animation: floatImage 3s ease-in-out infinite;
        }

        @keyframes floatImage {
            0%, 100% {
                transform: translateY(0px);
                box-shadow: 0 5px 20px rgba(255, 107, 107, 0.1);
            }
            50% {
                transform: translateY(-10px);
                box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3);
            }
        }

        .product-card .product-image.glow {
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 107, 107, 0.1), 0 0 20px rgba(255, 107, 107, 0.05);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.4), 0 0 60px rgba(255, 107, 107, 0.2);
                transform: scale(1.02);
            }
        }

        .product-card .product-image.rotate {
            animation: rotateFloat 4s ease-in-out infinite;
        }

        @keyframes rotateFloat {
            0%, 100% {
                transform: rotate(0deg) scale(1);
                box-shadow: 0 5px 20px rgba(255, 107, 107, 0.1);
            }
            25% {
                transform: rotate(2deg) scale(1.02);
                box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3);
            }
            75% {
                transform: rotate(-2deg) scale(1.02);
                box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3);
            }
        }

        .product-card .product-image.pulse {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 107, 107, 0.1);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 107, 107, 0.4), 0 0 80px rgba(255, 107, 107, 0.15);
                transform: scale(1.03);
            }
        }

        .product-card .product-image .no-image {
            color: rgba(255, 255, 255, 0.2);
            font-size: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .product-card .product-image .no-image i {
            font-size: 50px;
        }

        .product-card .product-image .no-image span {
            font-size: 14px;
        }

        .product-card .product-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            transition: 0.4s;
            position: relative;
            z-index: 1;
        }

        .product-card:hover .product-id-badge {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        .product-card h4 {
            font-size: 18px;
            margin-bottom: 6px;
            min-height: 45px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }

        .product-card:hover h4 {
            color: var(--secondary);
        }

        .product-card h4 i {
            color: var(--primary);
            margin-left: 8px;
            font-size: 14px;
            transition: 0.4s;
        }

        .product-card:hover h4 i {
            transform: rotate(15deg) scale(1.2);
            color: var(--secondary);
        }

        .product-card .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 8px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
            text-shadow: 0 0 15px rgba(255, 217, 61, 0.3);
        }

        .product-card:hover .price {
            text-shadow: 0 0 25px rgba(255, 217, 61, 0.7);
            transform: scale(1.05);
        }

        .product-card .price i {
            font-size: 16px;
            margin-right: 6px;
        }

        .product-card .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .product-card .card-actions .btn-sm {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .product-card .card-actions .btn-cart {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            position: relative;
            overflow: hidden;
        }

        .product-card .card-actions .btn-cart::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .product-card .card-actions .btn-cart:hover::after {
            left: 100%;
        }

        .product-card .card-actions .btn-cart:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .product-card .card-actions .btn-details {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 50px;
        }

        .product-card .card-actions .btn-details:hover {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
            border-color: transparent;
        }

        /* ===== Loading Spinner ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            gap: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        .loading-spinner i {
            animation: spin 1s linear infinite;
            font-size: 32px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.6));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* ===== Footer ===== */
        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 28px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            z-index: 100;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            color: #6bcb77;
            font-size: 22px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }
            .navbar .logo {
                font-size: 22px;
            }
            .navbar .nav-links {
                gap: 12px;
            }
            .navbar .nav-links a {
                font-size: 13px;
            }
            .page-header h1 {
                font-size: 30px;
            }
            .main-content {
                padding: 30px 15px;
            }
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }
            .product-card .product-image {
                height: 150px;
            }
            .toast {
                bottom: 20px;
                right: 20px;
                left: 20px;
                padding: 14px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 500px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .product-card .product-image {
                height: 200px;
            }
            .page-header h1 {
                font-size: 24px;
            }
            .page-header .category-icon-big {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Colorful Background -->
    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="../index.html" class="logo">
            <i class="fas fa-store"></i>
            متجرنا
        </a>
        <div class="nav-links">
            <a href="../index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="products.html"><i class="fas fa-box"></i> المنتجات</a>
            <a href="categories.html"><i class="fas fa-tags"></i> التصنيفات</a>
            <a href="about.html"><i class="fas fa-info-circle"></i> تعرف علينا</a>
            <a href="cart.html" class="cart-badge">
                <i class="fas fa-shopping-cart"></i> السلة
                <span class="badge-count" id="cartBadge">0</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">

        <div class="back-btn" onclick="window.location.href='categories.html'" data-aos="fade-left">
            <i class="fas fa-arrow-right"></i>
            العودة للتصنيفات
        </div>

        <div class="page-header" id="pageHeader" data-aos="fade-down">
            <i class="fas fa-tag category-icon-big" id="categoryIcon"></i>
            <h1 id="categoryTitle">منتجات التصنيف</h1>
            <p id="categoryDesc">عرض جميع المنتجات في هذا التصنيف</p>
            <span class="category-id-badge" id="categoryIdBadge">#CAT-000</span>
        </div>

        <div id="productsContainer">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch"></i>
                جاري تحميل المنتجات...
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">تمت الإضافة</span>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>
            <i class="fas fa-heart"></i>
            جميع الحقوق محفوظة © 2024 متجرنا
        </p>
    </div>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true,
            offset: 100
        });
    </script>

    <script>
        (function() {
            const SUPABASE_URL = 'https://cqdgqawjxofbwzcoliut.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxZGdxYXdqeG9mYnd6Y29saXV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNjI2NDgsImV4cCI6MjA3OTYzODY0OH0.0HM9teLT_16Cdx_SwQlNj7QguBcVcdunhJ1kcIPq19s';

            const productsContainer = document.getElementById('productsContainer');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const categoryTitle = document.getElementById('categoryTitle');
            const categoryDesc = document.getElementById('categoryDesc');
            const categoryIdBadge = document.getElementById('categoryIdBadge');
            const categoryIcon = document.getElementById('categoryIcon');
            const cartBadge = document.getElementById('cartBadge');
            let toastTimeout;

            const STORAGE_BUCKET = 'products';
            const STORAGE_URL = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/`;

            const floatEffects = ['floating', 'glow', 'rotate', 'pulse'];

            // ===== إدارة السلة =====
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            function updateCartBadge() {
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                if (cartBadge) {
                    cartBadge.textContent = totalItems;
                    cartBadge.style.display = totalItems > 0 ? 'flex' : 'none';
                }
            }

            function saveCart() {
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartBadge();
                window.dispatchEvent(new Event('storage'));
            }

            function getUrlParams() {
                const params = new URLSearchParams(window.location.search);
                return {
                    categoryId: params.get('id'),
                    categoryName: params.get('name'),
                    categoryDescText: params.get('desc')
                };
            }

            function showToast(message) {
                toastMessage.textContent = message;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            window.addToCart = function(productId, productName, price, imageUrl) {
                const existing = cart.find(item => item.id === productId);
                if (existing) {
                    existing.quantity += 1;
                    showToast(`✅ تم زيادة كمية "${productName}"`);
                } else {
                    cart.push({
                        id: productId,
                        name: productName,
                        price: price,
                        image: imageUrl || null,
                        quantity: 1
                    });
                    showToast(`✅ تم إضافة "${productName}" إلى السلة`);
                }
                saveCart();
            };

            function safeToString(value) {
                if (value === null || value === undefined) return '';
                return String(value);
            }

            function getCategoryIconByName(name) {
                const icons = {
                    'washing machines': 'fa-tshirt',
                    'refrigerators': 'fa-snowflake',
                    'freezers': 'fa-icicles',
                    'laptops': 'fa-laptop',
                    'smartphones': 'fa-mobile-alt',
                    'tablets': 'fa-tablet-alt',
                    'televisions': 'fa-tv',
                    'microwaves': 'fa-microscope',
                    'dishwashers': 'fa-utensils',
                    'vacuum cleaners': 'fa-broom',
                    'air conditioners': 'fa-wind',
                    'water heaters': 'fa-hot-tub',
                    'coffee makers': 'fa-mug-hot',
                    'blenders': 'fa-blender-phone',
                    'ovens': 'fa-fire'
                };
                const lowerName = name.toLowerCase();
                for (const [key, icon] of Object.entries(icons)) {
                    if (lowerName.includes(key)) {
                        return icon;
                    }
                }
                return 'fa-tag';
            }

            function getImageUrl(imagePath) {
                if (!imagePath || imagePath.trim() === '') return null;
                if (imagePath.startsWith('http')) return imagePath;
                return STORAGE_URL + imagePath;
            }

            async function loadCategoryProducts() {
                try {
                    const params = getUrlParams();
                    const categoryId = params.categoryId;
                    const categoryName = params.categoryName || 'التصنيف';
                    const categoryDescText = params.categoryDescText || '';

                    categoryTitle.textContent = `📂 منتجات "${categoryName}"`;
                    categoryDesc.textContent = categoryDescText || `جميع المنتجات في تصنيف ${categoryName}`;
                    categoryIdBadge.textContent = `#${categoryId}`;
                    categoryIcon.className = `fas ${getCategoryIconByName(categoryName)} category-icon-big`;

                    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                    const { data: products, error } = await supabase
                        .from('Product')
                        .select('*')
                        .eq('Category_ID', parseInt(categoryId));

                    if (error) throw new Error(error.message);

                    console.log('✅ تم تحميل منتجات التصنيف:', products);

                    if (!products || products.length === 0) {
                        productsContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-box-open"></i>
                                <p>لا توجد منتجات في هذا التصنيف</p>
                            </div>
                        `;
                        return;
                    }

                    let html = `<div class="product-grid">`;
                    const icons = ['fa-tag', 'fa-box', 'fa-cube', 'fa-gem', 'fa-star', 'fa-circle', 'fa-square', 'fa-crown', 'fa-heart', 'fa-fire'];

                    products.forEach((item, index) => {
                        const productId = safeToString(item.Product_ID);
                        const productName = safeToString(item.Product_Name);
                        const price = parseFloat(item.Selling_Price) || 0;
                        const icon = icons[index % icons.length];

                        const imagePath = item.Image_URL || null;
                        const imageUrl = getImageUrl(imagePath);
                        const effect = floatEffects[index % floatEffects.length];

                        html += `
                            <div class="product-card" style="animation-delay: ${index * 0.1}s">
                                <div class="product-image ${effect}">
                                    ${imageUrl ?
                                        `<img src="${escapeHtml(imageUrl)}"
                                              alt="${escapeHtml(productName)}"
                                              loading="lazy"
                                              onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'><i class=\\'fas fa-image\\'></i><span>لا توجد صورة</span></div>'">` :
                                        `<div class="no-image">
                                            <i class="fas fa-image"></i>
                                            <span>لا توجد صورة</span>
                                        </div>`
                                    }
                                </div>
                                <div class="product-id-badge">
                                    <i class="fas fa-barcode"></i> ${escapeHtml(productId) || '—'}
                                </div>
                                <h4>
                                    <i class="fas ${icon}"></i>
                                    ${escapeHtml(productName) || 'بدون اسم'}
                                </h4>
                                <div class="price">
                                    <i class="fas fa-tag"></i>
                                    ${price > 0 ? Number(price).toLocaleString('en-US') + ' ج.م' : '—'}
                                </div>
                                <div class="card-actions">
                                    <button class="btn-sm btn-cart" onclick="addToCart('${escapeHtml(productId)}', '${escapeHtml(productName)}', ${price}, '${escapeHtml(imagePath || '')}')">
                                        <i class="fas fa-cart-plus"></i> أضف للسلة
                                    </button>
                                    <a href="product-details.html?id=${escapeHtml(productId)}" class="btn-sm btn-details">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                    productsContainer.innerHTML = html;

                    updateCartBadge();

                } catch (error) {
                    console.error('❌ خطأ:', error);
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">${error.message}</p>
                        </div>
                    `;
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            window.addEventListener('storage', function(e) {
                if (e.key === 'cart') {
                    cart = JSON.parse(e.newValue) || [];
                    updateCartBadge();
                }
            });

            loadCategoryProducts();

        })();
    </script>

</body>
</html>
