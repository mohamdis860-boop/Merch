<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجات التصنيف - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    
    <!-- ✅ Shared Styles (مسار من Pages/) -->
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Animated Colorful Background ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation .blob:nth-child(2) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -7s;
        }

        .bg-animation .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -14s;
        }

        .bg-animation .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%;
            right: 20%;
            animation-delay: -4s;
        }

        .bg-animation .blob:nth-child(5) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%;
            left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Main Content ===== */
        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(6px);
        }

        .back-btn i {
            transition: 0.35s;
        }

        .back-btn:hover i {
            transform: translateX(4px);
        }

        /* ===== Page Header ===== */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header .category-icon-big {
            font-size: 60px;
            color: var(--primary);
            display: block;
            margin-bottom: 15px;
            animation: categoryIconBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5));
        }

        @keyframes categoryIconBounce {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-12px) rotate(-8deg) scale(1.08); }
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
        }

        .page-header .category-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            transition: 0.4s;
        }

        .page-header .category-id-badge:hover {
            background: rgba(255, 107, 107, 0.3);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        /* ===== Product Grid ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px 20px 25px;
            transition:
                transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease,
                background 0.4s ease,
                border-color 0.4s ease;
            animation: cardSlideUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.06), transparent, rgba(108, 92, 231, 0.06), transparent);
            animation: rotateGlow 12s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .product-card:hover {
            transform: translateY(-15px) scale(1.03);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(255, 107, 107, 0.25);
            z-index: 10;
        }

        .product-card .product-image {
            width: 100%;
            height: 200px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: 0.5s;
        }

        .product-card .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .product-card:hover .product-image img {
            transform: scale(1.1);
        }

        /* تأثيرات الصور المتنوعة */
        .product-card .product-image.floating {
            animation: floatImage 3s ease-in-out infinite;
        }

        @keyframes floatImage {
            0%, 100% {
                transform: translateY(0px);
                box-shadow: 0 5px 20px rgba(255, 107, 107, 0.1);
            }
            50% {
                transform: translateY(-10px);
                box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3);
            }
        }

        .product-card .product-image.glow {
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 107, 107, 0.1), 0 0 20px rgba(255, 107, 107, 0.05);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.4), 0 0 60px rgba(255, 107, 107, 0.2);
                transform: scale(1.02);
            }
        }

        .product-card .product-image.rotate {
            animation: rotateFloat 4s ease-in-out infinite;
        }

        @keyframes rotateFloat {
            0%, 100% {
                transform: rotate(0deg) scale(1);
                box-shadow: 0 5px 20px rgba(255, 107, 107, 0.1);
            }
            25% {
                transform: rotate(2deg) scale(1.02);
                box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3);
            }
            75% {
                transform: rotate(-2deg) scale(1.02);
                box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3);
            }
        }

        .product-card .product-image.pulse {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 107, 107, 0.1);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 107, 107, 0.4), 0 0 80px rgba(255, 107, 107, 0.15);
                transform: scale(1.03);
            }
        }

        .product-card .product-image .no-image {
            color: rgba(255, 255, 255, 0.2);
            font-size: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .product-card .product-image .no-image i {
            font-size: 50px;
        }

        .product-card .product-image .no-image span {
            font-size: 14px;
        }

        .product-card .product-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            transition: 0.4s;
            position: relative;
            z-index: 1;
        }

        .product-card:hover .product-id-badge {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        .product-card h4 {
            font-size: 18px;
            margin-bottom: 6px;
            min-height: 45px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }

        .product-card:hover h4 {
            color: var(--secondary);
        }

        .product-card h4 i {
            color: var(--primary);
            margin-right: 8px;
            font-size: 14px;
            transition: 0.4s;
        }

        .product-card:hover h4 i {
            transform: rotate(15deg) scale(1.2);
            color: var(--secondary);
        }

        .product-card .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 8px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
            text-shadow: 0 0 15px rgba(255, 217, 61, 0.3);
        }

        .product-card:hover .price {
            text-shadow: 0 0 25px rgba(255, 217, 61, 0.7);
            transform: scale(1.05);
        }

        .product-card .price i {
            font-size: 16px;
            margin-right: 6px;
        }

        .product-card .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .product-card .card-actions .btn-sm {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .product-card .card-actions .btn-cart {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            position: relative;
            overflow: hidden;
        }

        .product-card .card-actions .btn-cart::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .product-card .card-actions .btn-cart:hover::after {
            left: 100%;
        }

        .product-card .card-actions .btn-cart:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .product-card .card-actions .btn-cart:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .product-card .card-actions .btn-details {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 50px;
        }

        .product-card .card-actions .btn-details:hover {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
            border-color: transparent;
        }

        /* ===== Loading Spinner ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            gap: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        .loading-spinner i {
            animation: spin 1s linear infinite;
            font-size: 32px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.6));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* ===== Footer ===== */
        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 30px;
            }
            .main-content {
                padding: 30px 15px;
            }
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }
            .product-card .product-image {
                height: 150px;
            }
        }

        @media (max-width: 500px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .product-card .product-image {
                height: 200px;
            }
            .page-header h1 {
                font-size: 24px;
            }
            .page-header .category-icon-big {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Colorful Background -->
    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- ⚠️ الـ Navbar هيتبني تلقائياً بالـ JavaScript -->

    <!-- Main Content -->
    <div class="main-content">

        <a href="categories.html" class="back-btn" data-aos="fade-left">
            <i class="fas fa-arrow-right"></i>
            العودة للتصنيفات
        </a>

        <div class="page-header" id="pageHeader" data-aos="fade-down">
            <i class="fas fa-tag category-icon-big" id="categoryIcon"></i>
            <h1 id="categoryTitle">منتجات التصنيف</h1>
            <p id="categoryDesc">عرض جميع المنتجات في هذا التصنيف</p>
            <span class="category-id-badge" id="categoryIdBadge">#CAT-000</span>
        </div>

        <div id="productsContainer">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch"></i>
                جاري تحميل المنتجات...
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>
            <i class="fas fa-heart"></i>
            جميع الحقوق محفوظة © 2024 متجرنا
        </p>
    </div>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true,
            offset: 100
        });
    </script>

    <!-- ✅ Shared Scripts (الترتيب مهم!) -->
    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            const productsContainer = document.getElementById('productsContainer');
            const categoryTitle = document.getElementById('categoryTitle');
            const categoryDesc = document.getElementById('categoryDesc');
            const categoryIdBadge = document.getElementById('categoryIdBadge');
            const categoryIcon = document.getElementById('categoryIcon');

            const floatEffects = ['floating', 'glow', 'rotate', 'pulse'];

            // ===== أدوات مساعدة =====
            function safeToString(value) {
                if (value === null || value === undefined) return '';
                return String(value);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getUrlParams() {
                const params = new URLSearchParams(window.location.search);
                return {
                    categoryId: params.get('id'),
                    categoryName: params.get('name'),
                    categoryDescText: params.get('desc')
                };
            }

            function getCategoryIconByName(name) {
                const icons = {
                    'washing machines': 'fa-tshirt',
                    'refrigerators': 'fa-snowflake',
                    'freezers': 'fa-icicles',
                    'laptops': 'fa-laptop',
                    'smartphones': 'fa-mobile-alt',
                    'tablets': 'fa-tablet-alt',
                    'televisions': 'fa-tv',
                    'microwaves': 'fa-microscope',
                    'dishwashers': 'fa-utensils',
                    'vacuum cleaners': 'fa-broom',
                    'air conditioners': 'fa-wind',
                    'water heaters': 'fa-hot-tub',
                    'coffee makers': 'fa-mug-hot',
                    'blenders': 'fa-blender-phone',
                    'ovens': 'fa-fire'
                };
                const lowerName = safeToString(name).toLowerCase();
                for (const [key, icon] of Object.entries(icons)) {
                    if (lowerName.includes(key)) {
                        return icon;
                    }
                }
                return 'fa-tag';
            }

            // ===== إنشاء كارت منتج =====
            function createProductCard(item, index) {
                const productId = safeToString(item.Product_ID);
                const productName = safeToString(item.Product_Name) || 'بدون اسم';
                const price = parseFloat(item.Selling_Price) || 0;

                const imagePath = item.Image_URL || null;
                const imageUrl = window.getImageUrl(imagePath);
                const effect = floatEffects[index % floatEffects.length];

                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.setAttribute('data-aos', 'zoom-in-up');
                card.setAttribute('data-aos-delay', String(Math.min(index * 50, 400)));

                // ===== صورة المنتج =====
                const imageWrapper = document.createElement('div');
                imageWrapper.className = `product-image ${effect}`;

                if (imageUrl) {
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = productName;
                    img.loading = 'lazy';
                    img.addEventListener('error', () => {
                        imageWrapper.innerHTML = `
                            <div class="no-image">
                                <i class="fas fa-image"></i>
                                <span>لا توجد صورة</span>
                            </div>
                        `;
                    });
                    imageWrapper.appendChild(img);
                } else {
                    imageWrapper.innerHTML = `
                        <div class="no-image">
                            <i class="fas fa-image"></i>
                            <span>لا توجد صورة</span>
                        </div>
                    `;
                }

                // ===== شارة ID المنتج =====
                const idBadge = document.createElement('div');
                idBadge.className = 'product-id-badge';
                idBadge.innerHTML = `<i class="fas fa-barcode"></i> ${escapeHtml(productId) || '—'}`;

                // ===== اسم المنتج =====
                const title = document.createElement('h4');
                title.innerHTML = `<i class="fas fa-tag"></i> ${escapeHtml(productName)}`;

                // ===== السعر =====
                const priceEl = document.createElement('div');
                priceEl.className = 'price';
                priceEl.innerHTML = `
                    <i class="fas fa-tag"></i>
                    ${price > 0 ? Number(price).toLocaleString('en-US') + ' ج.م' : '—'}
                `;

                // ===== الأزرار =====
                const actions = document.createElement('div');
                actions.className = 'card-actions';

                // زر السلة
                const cartBtn = document.createElement('button');
                cartBtn.className = 'btn-sm btn-cart';
                cartBtn.innerHTML = `<i class="fas fa-cart-plus"></i> أضف للسلة`;
                cartBtn.addEventListener('click', function() {
                    if (this.disabled) return;
                    this.disabled = true;
                    // ✅ استخدم الدالة الموحّدة
                    window.addToCartItem(productId, productName, price, imagePath || '');
                    setTimeout(() => { this.disabled = false; }, 500);
                });

                // زر التفاصيل
                const detailsBtn = document.createElement('a');
                detailsBtn.className = 'btn-sm btn-details';
                detailsBtn.href = `product-details.html?id=${encodeURIComponent(productId)}`;
                detailsBtn.innerHTML = `<i class="fas fa-eye"></i>`;

                actions.appendChild(cartBtn);
                actions.appendChild(detailsBtn);

                // ===== تجميع الكارت =====
                card.appendChild(imageWrapper);
                card.appendChild(idBadge);
                card.appendChild(title);
                card.appendChild(priceEl);
                card.appendChild(actions);

                return card;
            }

            // ===== تحميل المنتجات =====
            async function loadCategoryProducts() {
                const params = getUrlParams();
                const categoryId = params.categoryId;
                const categoryName = params.categoryName || 'التصنيف';
                const categoryDescText = params.categoryDescText || '';

                // تحديث رأس الصفحة
                categoryTitle.textContent = `📂 منتجات "${categoryName}"`;
                categoryDesc.textContent = categoryDescText || `جميع المنتجات في تصنيف ${categoryName}`;
                categoryIdBadge.textContent = `#${categoryId || '—'}`;
                categoryIcon.className = `fas ${getCategoryIconByName(categoryName)} category-icon-big`;

                // تحقق من صحة ID
                const numericId = parseInt(categoryId, 10);
                if (!categoryId || isNaN(numericId)) {
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">معرّف التصنيف غير صالح</p>
                        </div>
                    `;
                    return;
                }

                try {
                    const { data: products, error } = await supabase
                        .from('Product')
                        .select('*')
                        .eq('Category_ID', numericId);

                    if (error) throw new Error(error.message);

                    console.log('✅ تم تحميل منتجات التصنيف:', products);

                    if (!products || products.length === 0) {
                        productsContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-box-open"></i>
                                <p>لا توجد منتجات في هذا التصنيف</p>
                            </div>
                        `;
                        return;
                    }

                    // بناء الشبكة
                    const grid = document.createElement('div');
                    grid.className = 'product-grid';

                    products.forEach((item, index) => {
                        grid.appendChild(createProductCard(item, index));
                    });

                    productsContainer.innerHTML = '';
                    productsContainer.appendChild(grid);

                    if (window.AOS && typeof AOS.refresh === 'function') {
                        AOS.refresh();
                    }

                } catch (error) {
                    console.error('❌ خطأ:', error);
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">${escapeHtml(error.message)}</p>
                        </div>
                    `;
                }
            }

            loadCategoryProducts();

            console.log('%c📦 Category Products page loaded', 'color: #ff6b6b; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
