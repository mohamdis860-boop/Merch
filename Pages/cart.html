<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة التسوق - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ✅ Shared Styles -->
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation .blob:nth-child(2) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -7s;
        }

        .bg-animation .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -14s;
        }

        .bg-animation .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%;
            right: 20%;
            animation-delay: -4s;
        }

        .bg-animation .blob:nth-child(5) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%;
            left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 20px;
            cursor: pointer;
            animation: fadeInLeft 0.7s ease-out;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(6px);
        }

        .back-btn i {
            transition: 0.35s;
        }

        .back-btn:hover i {
            transform: translateX(4px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.9s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header .cart-icon-big {
            font-size: 60px;
            color: var(--primary);
            display: block;
            margin-bottom: 15px;
            animation: cartBounce 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5));
        }

        @keyframes cartBounce {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-10px) rotate(-5deg) scale(1.05); }
            50% { transform: translateY(0) rotate(0deg) scale(1); }
            75% { transform: translateY(-6px) rotate(5deg) scale(1.03); }
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .cart-container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            min-height: 300px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: fadeInUp 0.9s ease-out 0.3s both;
        }

        .cart-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.04), transparent, rgba(108, 92, 231, 0.04), transparent);
            animation: rotateGlow 12s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== Loading Spinner (جديد) ===== */
        .cart-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 15px;
            color: rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
        }

        .cart-loading i {
            font-size: 40px;
            color: var(--primary);
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.6));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cart-loading p {
            font-size: 16px;
        }

        .cart-empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.7s ease-out;
        }

        .cart-empty i {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .cart-empty h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.3);
        }

        .cart-empty p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .start-shopping-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            transition: 0.35s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .start-shopping-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .start-shopping-btn:hover::after {
            left: 100%;
        }

        .start-shopping-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 14px 35px rgba(255, 107, 107, 0.6);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            animation: itemSlideIn 0.45s ease-out both;
            position: relative;
            z-index: 1;
            transition: 0.35s;
            cursor: grab;
            user-select: none;
        }

        .cart-item:active {
            cursor: grabbing;
        }

        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 40px;
            color: rgba(255, 255, 255, 0.25);
            cursor: grab;
            transition: 0.3s;
            flex-shrink: 0;
            font-size: 14px;
        }

        .drag-handle:hover {
            color: var(--primary);
            transform: scale(1.2);
        }

        .cart-item.sortable-ghost {
            opacity: 0.4;
            background: rgba(255, 107, 107, 0.1);
            border: 2px dashed var(--primary);
            border-radius: 12px;
        }

        .cart-item.sortable-drag {
            opacity: 0.95;
            transform: rotate(2deg) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            background: rgba(30, 30, 60, 0.95);
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.5);
        }

        .cart-item:hover {
            background: rgba(255, 255, 255, 0.02);
            padding-right: 10px;
            padding-left: 10px;
            border-radius: 12px;
        }

        @keyframes itemSlideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item .item-image {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.4s;
        }

        .cart-item:hover .item-image {
            transform: scale(1.06) rotate(-2deg);
            border-color: rgba(255, 107, 107, 0.4);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.25);
        }

        .cart-item .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .cart-item:hover .item-image img {
            transform: scale(1.1);
        }

        .cart-item .item-image .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: rgba(255, 255, 255, 0.2);
            font-size: 30px;
        }

        .cart-item .item-details {
            flex: 1;
            min-width: 0;
        }

        .cart-item .item-details h3 {
            font-size: 18px;
            margin-bottom: 4px;
            transition: 0.35s;
        }

        .cart-item:hover .item-details h3 {
            color: var(--secondary);
        }

        .cart-item .item-details .item-id {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Courier New', monospace;
        }

        .cart-item .item-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
            min-width: 100px;
            text-align: center;
        }

        .cart-item .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 100px;
            justify-content: center;
        }

        .cart-item .item-quantity button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.35s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item .item-quantity button:hover {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }

        .cart-item .item-quantity span {
            font-size: 18px;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
            transition: 0.35s;
        }

        .cart-item:hover .item-quantity span {
            color: var(--primary);
            transform: scale(1.15);
        }

        .cart-item .item-total {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            min-width: 120px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 107, 107, 0.4);
        }

        .cart-item .item-remove {
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: 0.4s;
            font-size: 18px;
            padding: 8px;
            border-radius: 50%;
        }

        .cart-item .item-remove:hover {
            color: var(--primary);
            transform: scale(1.25) rotate(10deg);
            background: rgba(255, 107, 107, 0.15);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
        }

        .cart-summary {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.7s ease-out 0.4s both;
        }

        .cart-summary .total-label {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            display: block;
            margin-bottom: 4px;
        }

        .cart-summary .total-price {
            font-size: 32px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 25px rgba(255, 217, 61, 0.5);
            animation: totalPulse 2.5s ease-in-out infinite;
        }

        @keyframes totalPulse {
            0%, 100% { text-shadow: 0 0 25px rgba(255, 217, 61, 0.5); }
            50% { text-shadow: 0 0 40px rgba(255, 217, 61, 0.9); }
        }

        .cart-summary .total-price i {
            font-size: 20px;
            margin-right: 8px;
        }

        .cart-summary .checkout-btn {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .cart-summary .checkout-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .cart-summary .checkout-btn:hover::after {
            left: 100%;
        }

        .cart-summary .checkout-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 14px 40px rgba(255, 107, 107, 0.6);
        }

        .cart-summary .clear-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .cart-summary .clear-btn:hover {
            background: rgba(220, 38, 38, 0.2);
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .reorder-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .reorder-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 30px; }
            .main-content { padding: 30px 15px; }
            .cart-item { flex-wrap: wrap; gap: 10px; }
            .cart-item .item-price,
            .cart-item .item-total { min-width: 80px; font-size: 16px; }
            .cart-item .item-quantity { min-width: 80px; }
            .cart-summary { flex-direction: column; align-items: stretch; gap: 15px; }
            .cart-summary .total-price { font-size: 28px; }
            .cart-summary .checkout-btn { width: 100%; justify-content: center; }
        }

        @media (max-width: 500px) {
            .cart-item .item-image { width: 60px; height: 60px; }
            .cart-item .item-details h3 { font-size: 15px; }
            .page-header h1 { font-size: 24px; }
            .drag-handle { width: 24px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- ⚠️ الـ Navbar هيتبني تلقائياً -->

    <!-- Main Content -->
    <div class="main-content">

        <div class="back-btn" onclick="window.location.href='products.html'">
            <i class="fas fa-arrow-right"></i>
            العودة للمنتجات
        </div>

        <div class="page-header">
            <i class="fas fa-shopping-cart cart-icon-big"></i>
            <h1>🛒 سلة التسوق</h1>
            <p>مراجعة المنتجات المضافة</p>
        </div>

        <div class="cart-container" id="cartContainer">

    <!-- ✅ Shared Scripts (الترتيب مهم!) -->
    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../shared/footer.js"></script>

    <script>
        (function() {
            'use strict';

            const cartContainer = document.getElementById('cartContainer');

            // ✅ ابدأ فاضي — هيتحدّث لما المستخدم يتحمّل
            let cart = [];

            // ===== reload السلة =====
            function reloadCart() {
                cart = window.getCart();
            }

            // ===== أدوات مساعدة =====
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function showReorderToast(message) {
                const existingToast = document.querySelector('.reorder-toast');
                if (existingToast) existingToast.remove();

                const toastEl = document.createElement('div');
                toastEl.className = 'reorder-toast';
                toastEl.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
                document.body.appendChild(toastEl);

                setTimeout(() => toastEl.classList.add('show'), 50);
                setTimeout(() => {
                    toastEl.classList.remove('show');
                    setTimeout(() => toastEl.remove(), 400);
                }, 2500);
            }

            // ===== حذف منتج =====
            window.removeFromCartLocal = function(productId) {
                const item = cart.find(i => String(i.id) === String(productId));
                if (item) {
                    window.showToast(`🗑️ تم حذف "${item.name}" من السلة`, 'info');
                }
                cart = cart.filter(i => String(i.id) !== String(productId));
                window.saveCart(cart);
                updateCartDisplay();
            };

            // ===== تحديث الكمية =====
            window.updateQuantity = function(productId, change) {
                const item = cart.find(i => String(i.id) === String(productId));
                if (!item) return;

                item.quantity += change;

                if (item.quantity <= 0) {
                    cart = cart.filter(i => String(i.id) !== String(productId));
                    window.saveCart(cart);
                    window.showToast(`🗑️ تم حذف "${item.name}" من السلة`, 'info');
                } else {
                    window.saveCart(cart);
                    window.showToast(`🔄 تم تحديث كمية "${item.name}"`, 'success');
                }

                reloadCart();
                updateCartDisplay();
            };

            // ===== تفريغ السلة =====
            window.clearCart = function() {
                if (cart.length === 0) return;
                if (!confirm('هل أنت متأكد من تفريغ السلة؟')) return;

                window.clearCartItems();
                reloadCart();
                updateCartDisplay();
            };

            // ===== Sortable =====
            function initializeSortable() {
                if (!window.Sortable) return;

                if (window.cartSortable) {
                    window.cartSortable.destroy();
                }

                window.cartSortable = new Sortable(cartContainer, {
                    animation: 300,
                    handle: '.drag-handle',
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    filter: '.cart-summary, .cart-empty, .cart-loading',
                    preventOnFilter: false,
                    onEnd: function() {
                        const itemElements = cartContainer.querySelectorAll('.cart-item');
                        const newOrder = [];

                        itemElements.forEach(el => {
                            const id = el.getAttribute('data-id');
                            if (id) {
                                const item = cart.find(i => String(i.id) === String(id));
                                if (item) newOrder.push(item);
                            }
                        });

                        if (newOrder.length === cart.length) {
                            cart = newOrder;
                            window.saveCart(cart);
                            showReorderToast('تم تحديث ترتيب المنتجات بنجاح');
                        }
                    }
                });
            }

            // ===== عرض السلة =====
            function updateCartDisplay() {
                if (cart.length === 0) {
                    cartContainer.innerHTML = `
                        <div class="cart-empty">
                            <i class="fas fa-shopping-bag"></i>
                            <h2>سلة فارغة</h2>
                            <p>لم تقم بإضافة أي منتجات بعد</p>
                            <button class="start-shopping-btn" onclick="window.location.href='products.html'">
                                <i class="fas fa-shopping-bag"></i> ابدأ التسوق
                            </button>
                        </div>
                    `;
                    return;
                }

                let total = 0;
                let html = '';

                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    const imageUrl = window.getImageUrl(item.image);

                    html += `
                        <div class="cart-item" data-id="${escapeHtml(String(item.id))}" style="animation-delay: ${index * 0.08}s">
                            <div class="drag-handle" title="اسحب لتغيير الترتيب">
                                <i class="fas fa-grip-vertical"></i>
                            </div>
                            <div class="item-image">
                                ${imageUrl ?
                                    `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(item.name)}" loading="lazy">` :
                                    `<div class="no-image"><i class="fas fa-image"></i></div>`
                                }
                            </div>
                            <div class="item-details">
                                <h3>${escapeHtml(item.name)}</h3>
                                <span class="item-id">#${escapeHtml(String(item.id))}</span>
                            </div>
                            <div class="item-price">${item.price.toLocaleString()} ج.م</div>
                            <div class="item-quantity">
                                <button onclick="updateQuantity('${escapeHtml(String(item.id))}', -1)"><i class="fas fa-minus"></i></button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity('${escapeHtml(String(item.id))}', 1)"><i class="fas fa-plus"></i></button>
                            </div>
                            <div class="item-total">${itemTotal.toLocaleString()} ج.م</div>
                            <div class="item-remove" onclick="removeFromCartLocal('${escapeHtml(String(item.id))}')">
                                <i class="fas fa-trash-alt"></i>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="cart-summary">
                        <div>
                            <span class="total-label">المجموع الكلي</span>
                            <span class="total-price"><i class="fas fa-tag"></i> ${total.toLocaleString()} ج.م</span>
                        </div>
                        <div style="display:flex;gap:10px;flex-wrap:wrap;">
                            <button class="clear-btn" onclick="clearCart()">
                                <i class="fas fa-trash-alt"></i> تفريغ السلة
                            </button>
                            <button class="checkout-btn" onclick="window.location.href='checkout.html'">
                                <i class="fas fa-credit-card"></i> إتمام الشراء
                            </button>
                        </div>
                    </div>
                `;

                cartContainer.innerHTML = html;

                setTimeout(() => initializeSortable(), 150);
            }

            // ===== الاستماع للتحديثات =====
            window.addEventListener('cartUpdated', () => {
                console.log('🔄 cartUpdated event received');
                reloadCart();
                updateCartDisplay();
            });

            window.addEventListener('storage', function(e) {
                if (e.key && e.key.startsWith('cart')) {
                    reloadCart();
                    updateCartDisplay();
                }
            });

            // ===== التهيئة =====
            // المشكلة: navbar.js بيعمل checkAuth بشكل async
            // فلما الصفحة تشتغل، window.currentUser لسه null
            // وبالتالي getCart() بترجع 'cart_guest' اللي فاضي!
            //
            // الحل: استنى cartUpdated من navbar.js أو استخدم fallback

            async function initCart() {
                console.log('⏳ Waiting for user auth...');

                // استنى لحد ما navbar.js يخلّص checkAuth
                // (بيعمل cartUpdated بعد ما يعرف المستخدم)
                let attempts = 0;
                const maxAttempts = 30; // 3 seconds

                while (attempts < maxAttempts) {
                    // لو الـ user اتحط أو لو guest cart موجود
                    if (window.currentUser) {
                        console.log('✅ User ready:', window.currentUser.email);
                        break;
                    }

                    // لو guest mode و مفيش session
                    if (attempts >= 10) {
                        // استنى 1.5 ثانية كفاية
                        console.log('👤 Assuming guest mode');
                        break;
                    }

                    await new Promise(r => setTimeout(r, 100));
                    attempts++;
                }

                // دلوقتي اقرأ السلة
                reloadCart();
                updateCartDisplay();

                console.log('🛒 Cart displayed. Items:', cart.length);
            }

            initCart();

            console.log('%c🛒 Cart page loaded', 'color: #ff6b6b; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
</html>
