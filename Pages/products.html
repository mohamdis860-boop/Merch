<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    
    <!-- ✅ Shared Styles (مسار من Pages/) -->
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Animated Colorful Background ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation .blob:nth-child(2) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -7s;
        }

        .bg-animation .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -14s;
        }

        .bg-animation .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%;
            right: 20%;
            animation-delay: -4s;
        }

        .bg-animation .blob:nth-child(5) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%;
            left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Main Content ===== */
        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(6px);
        }

        .back-btn i {
            transition: 0.35s;
        }

        .back-btn:hover i {
            transform: translateX(4px);
        }

        /* ===== Page Header ===== */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== Filter Section ===== */
        .filter-section {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 35px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .filter-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.04), transparent, rgba(108, 92, 231, 0.04), transparent);
            animation: rotateGlow 15s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .filter-section .search-box {
            flex: 1;
            min-width: 250px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50px;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s;
            position: relative;
            z-index: 1;
        }

        .filter-section .search-box:focus-within {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.25);
            transform: scale(1.02);
        }

        .filter-section .search-box i {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            transition: 0.35s;
        }

        .filter-section .search-box:focus-within i {
            color: var(--primary);
            transform: scale(1.15);
        }

        .filter-section .search-box input {
            background: transparent;
            border: none;
            padding: 14px 15px;
            color: white;
            font-size: 16px;
            width: 100%;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .filter-section .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .filter-section .filter-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .filter-section .filter-options select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            outline: none;
            min-width: 150px;
            transition: 0.4s;
        }

        .filter-section .filter-options select:hover,
        .filter-section .filter-options select:focus {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.1);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);
        }

        .filter-section .filter-options select option {
            background: #1a1a2e;
            color: white;
        }

        .filter-section .results-count {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-right: auto;
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-section .results-count i {
            color: var(--primary);
        }

        .filter-section .results-count span {
            color: var(--secondary);
            font-weight: 700;
            font-size: 18px;
            text-shadow: 0 0 12px rgba(255, 217, 61, 0.4);
        }

        /* ===== Product Grid ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            perspective: 1000px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            transition:
                transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease,
                background 0.4s ease,
                border-color 0.4s ease;
            animation: cardSlideUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            will-change: transform;
        }

        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.06), transparent, rgba(108, 92, 231, 0.06), transparent);
            animation: rotateGlow 12s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card:hover {
            transform: translateY(-15px) scale(1.03);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(255, 107, 107, 0.25);
            z-index: 10;
        }

        .product-card .product-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
            transition: 0.4s;
            position: relative;
            z-index: 1;
        }

        .product-card:hover .product-id-badge {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        .product-card h4 {
            font-size: 18px;
            margin-bottom: 8px;
            min-height: 50px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }

        .product-card:hover h4 {
            color: var(--secondary);
        }

        .product-card h4 i {
            color: var(--primary);
            margin-right: 8px;
            font-size: 14px;
            transition: 0.4s;
        }

        .product-card:hover h4 i {
            transform: rotate(15deg) scale(1.2);
            color: var(--secondary);
        }

        .product-card .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 10px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
            text-shadow: 0 0 15px rgba(255, 217, 61, 0.3);
        }

        .product-card:hover .price {
            text-shadow: 0 0 25px rgba(255, 217, 61, 0.7);
            transform: scale(1.05);
        }

        .product-card .price i {
            font-size: 16px;
            margin-right: 6px;
        }

        .product-card .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .product-card .card-actions .btn-sm {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .product-card .card-actions .btn-cart {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            position: relative;
            overflow: hidden;
        }

        .product-card .card-actions .btn-cart::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .product-card .card-actions .btn-cart:hover::after {
            left: 100%;
        }

        .product-card .card-actions .btn-cart:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .product-card .card-actions .btn-cart:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .product-card .card-actions .btn-details {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 50px;
        }

        .product-card .card-actions .btn-details:hover {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
            border-color: transparent;
        }

        /* ===== Loading Spinner ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            gap: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        .loading-spinner i {
            animation: spin 1s linear infinite;
            font-size: 32px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.6));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* ===== Footer ===== */
        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 30px;
            }
            .main-content {
                padding: 30px 15px;
            }
            .filter-section {
                padding: 20px;
                flex-direction: column;
            }
            .filter-section .search-box {
                width: 100%;
                min-width: unset;
            }
            .filter-section .filter-options {
                width: 100%;
            }
            .filter-section .filter-options select {
                flex: 1;
                min-width: 120px;
            }
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .filter-section .filter-options select {
                min-width: 100%;
            }
            .page-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true,
            offset: 100
        });
    </script>

    <!-- ✅ Shared Scripts (الترتيب مهم!) -->
    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../shared/footer.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            const productsContainer = document.getElementById('productsContainer');
            const searchInput = document.getElementById('searchInput');
            const sortFilter = document.getElementById('sortFilter');
            const resultCount = document.getElementById('resultCount');

            let allProducts = [];
            let filteredProducts = [];

            // ===== أدوات مساعدة =====
            function safeToString(value) {
                if (value === null || value === undefined) return '';
                return String(value);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ===== إنشاء كارت منتج =====
            function createProductCard(item, index) {
                const productId = safeToString(item.Product_ID);
                const productName = safeToString(item.Product_Name) || 'بدون اسم';
                const price = parseFloat(item.Selling_Price) || 0;
                const imageUrl = item.Image_URL || '';

                const icons = ['fa-tag', 'fa-box', 'fa-cube', 'fa-gem', 'fa-star', 'fa-circle', 'fa-square', 'fa-crown', 'fa-heart', 'fa-fire'];
                const icon = icons[index % icons.length];

                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${index * 0.08}s`;
                card.setAttribute('data-aos', 'zoom-in-up');
                card.setAttribute('data-aos-delay', String(Math.min(index * 50, 400)));

                // شارة ID
                const idBadge = document.createElement('div');
                idBadge.className = 'product-id-badge';
                idBadge.innerHTML = `<i class="fas fa-barcode"></i> ${escapeHtml(productId) || '—'}`;

                // اسم المنتج
                const title = document.createElement('h4');
                title.innerHTML = `<i class="fas ${icon}"></i> ${escapeHtml(productName)}`;

                // السعر
                const priceEl = document.createElement('div');
                priceEl.className = 'price';
                priceEl.innerHTML = `
                    <i class="fas fa-tag"></i>
                    ${price > 0 ? Number(price).toLocaleString('en-US') + ' ج.م' : '—'}
                `;

                // الأزرار
                const actions = document.createElement('div');
                actions.className = 'card-actions';

                const cartBtn = document.createElement('button');
                cartBtn.className = 'btn-sm btn-cart';
                cartBtn.innerHTML = `<i class="fas fa-cart-plus"></i> أضف للسلة`;
                cartBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.disabled) return;
                    this.disabled = true;
                    // ✅ استخدم الدالة الموحّدة
                    window.addToCartItem(productId, productName, price, imageUrl);
                    setTimeout(() => { this.disabled = false; }, 500);
                });

                const detailsBtn = document.createElement('button');
                detailsBtn.className = 'btn-sm btn-details';
                detailsBtn.innerHTML = `<i class="fas fa-eye"></i>`;
                detailsBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.location.href = `product-details.html?id=${encodeURIComponent(productId)}`;
                });

                actions.appendChild(cartBtn);
                actions.appendChild(detailsBtn);

                card.appendChild(idBadge);
                card.appendChild(title);
                card.appendChild(priceEl);
                card.appendChild(actions);

                // النقر على الكارت → صفحة التفاصيل
                card.addEventListener('click', function() {
                    window.location.href = `product-details.html?id=${encodeURIComponent(productId)}`;
                });

                return card;
            }

            // ===== تحميل المنتجات =====
            async function loadProducts() {
                try {
                    const { data, error } = await supabase
                        .from('Product')
                        .select('Product_ID, Product_Name, Selling_Price, Image_URL');

                    if (error) throw new Error(error.message);

                    console.log('✅ تم تحميل المنتجات:', data);

                    allProducts = data || [];
                    filteredProducts = [...allProducts];
                    renderProducts();

                } catch (error) {
                    console.error('❌ خطأ:', error);
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">${escapeHtml(error.message)}</p>
                        </div>
                    `;
                }
            }

            // ===== عرض المنتجات =====
            function renderProducts() {
                if (!filteredProducts || filteredProducts.length === 0) {
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-box-open"></i>
                            <p>لا توجد منتجات تطابق بحثك</p>
                        </div>
                    `;
                    resultCount.textContent = '0';
                    return;
                }

                resultCount.textContent = filteredProducts.length;

                const grid = document.createElement('div');
                grid.className = 'product-grid';

                filteredProducts.forEach((item, index) => {
                    grid.appendChild(createProductCard(item, index));
                });

                productsContainer.innerHTML = '';
                productsContainer.appendChild(grid);

                if (window.AOS && typeof AOS.refresh === 'function') {
                    AOS.refresh();
                }
            }

            // ===== الفلترة والترتيب =====
            function filterAndSort() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const sortValue = sortFilter.value;

                let filtered = allProducts.filter(item => {
                    const name = safeToString(item.Product_Name).toLowerCase();
                    const id = safeToString(item.Product_ID).toLowerCase();
                    return name.includes(searchTerm) || id.includes(searchTerm);
                });

                switch (sortValue) {
                    case 'price_asc':
                        filtered.sort((a, b) => (parseFloat(a.Selling_Price) || 0) - (parseFloat(b.Selling_Price) || 0));
                        break;
                    case 'price_desc':
                        filtered.sort((a, b) => (parseFloat(b.Selling_Price) || 0) - (parseFloat(a.Selling_Price) || 0));
                        break;
                    case 'name_asc':
                        filtered.sort((a, b) => safeToString(a.Product_Name).localeCompare(safeToString(b.Product_Name)));
                        break;
                    case 'name_desc':
                        filtered.sort((a, b) => safeToString(b.Product_Name).localeCompare(safeToString(a.Product_Name)));
                        break;
                }

                filteredProducts = filtered;
                renderProducts();
            }

            // ===== ربط الأحداث =====
            searchInput.addEventListener('input', filterAndSort);
            sortFilter.addEventListener('change', filterAndSort);

                        // ===== قراءة q من URL =====
            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q');
            if (initialQuery && searchInput) {
                searchInput.value = initialQuery;
            }

            // ===== تشغيل =====
            loadProducts().then(() => {
                if (initialQuery) {
                    filterAndSort();
                }
            });

            console.log('%c🛍️ Products page loaded', 'color: #ff6b6b; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
