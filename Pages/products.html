<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
        }

        html {
            background-color: #0a0a1a !important;
            overscroll-behavior: none;
        }

        body {
            background-color: #0a0a1a !important;
            background-image: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 768px) {
            body {
                background-image: none !important;
                animation: none !important;
            }
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        @media (max-width: 768px) {
            .bg-animation { display: none !important; }
        }

        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(6px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== Toolbar ===== */
        .toolbar {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .toolbar .search-box {
            flex: 1;
            min-width: 220px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50px;
            padding: 0 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s;
        }

        .toolbar .search-box:focus-within {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.25);
        }

        .toolbar .search-box i {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
        }

        .toolbar .search-box:focus-within i { color: var(--primary); }

        .toolbar .search-box input {
            background: transparent;
            border: none;
            padding: 13px 14px;
            color: white;
            font-size: 15px;
            width: 100%;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .toolbar .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .toolbar select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 11px 18px;
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            outline: none;
            min-width: 160px;
            transition: 0.3s;
        }

        .toolbar select:hover,
        .toolbar select:focus {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.1);
        }

        .toolbar select option {
            background: #1a1a2e;
            color: white;
        }

        /* ✅ زر الفلاتر */
        .btn-filters-toggle {
            padding: 11px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            position: relative;
            white-space: nowrap;
        }

        .btn-filters-toggle:hover {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.4);
            color: var(--primary);
        }

        .btn-filters-toggle.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-filters-toggle .filter-count {
            display: none;
            background: #fff;
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .btn-filters-toggle.has-filters .filter-count { display: flex; }

        .btn-filters-toggle .chevron {
            transition: transform 0.3s;
        }

        .btn-filters-toggle.active .chevron {
            transform: rotate(180deg);
        }

        /* ===== Filters Panel (Dropdown) ===== */
        .filters-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            margin-bottom: 20px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        opacity 0.3s,
                        margin 0.3s,
                        padding 0.3s;
            padding: 0 24px;
        }

        .filters-panel.open {
            max-height: 1200px;
            opacity: 1;
            padding: 24px;
            margin-bottom: 20px;
        }

        /* Filter Grid */
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .filter-block {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px;
        }

        .filter-block-title {
            font-size: 14px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-block-title i { color: var(--primary); font-size: 14px; }

        /* Price */
        .price-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .price-inputs input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            outline: none;
            text-align: center;
            transition: 0.3s;
            min-width: 0;
        }

        .price-inputs input:focus {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.12);
        }

        .price-inputs input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .price-inputs .dash {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
        }

        /* Categories */
        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 140px;
            overflow-y: auto;
        }

        .categories-list::-webkit-scrollbar { width: 4px; }
        .categories-list::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 107, 0.3);
            border-radius: 4px;
        }

        .cat-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .cat-checkbox:hover {
            background: rgba(255, 107, 107, 0.08);
            color: white;
        }

        .cat-checkbox input { display: none; }

        .cat-checkbox .checkmark {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .cat-checkbox .checkmark i {
            font-size: 8px;
            color: white;
            opacity: 0;
            transform: scale(0);
            transition: 0.2s;
        }

        .cat-checkbox input:checked ~ .checkmark {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-color: transparent;
        }

        .cat-checkbox input:checked ~ .checkmark i {
            opacity: 1;
            transform: scale(1);
        }

        .cat-checkbox .cat-count {
            margin-right: auto;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
        }

        /* Radio chips (بدل radio list) */
        .chip-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-option {
            cursor: pointer;
            user-select: none;
        }

        .chip-option input { display: none; }

        .chip-option span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            transition: 0.3s;
        }

        .chip-option:hover span {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #fff;
        }

        .chip-option input:checked ~ span {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .chip-option .stars {
            display: inline-flex;
            gap: 1px;
            color: #ffd93d;
            font-size: 10px;
        }

        /* Filters Footer (Actions) */
        .filters-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
        }

        .filters-footer .result-hint {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filters-footer .result-hint strong {
            color: var(--secondary);
            font-weight: 800;
        }

        .filters-footer .actions {
            display: flex;
            gap: 10px;
        }

        .btn-filter-action {
            padding: 11px 22px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            border: none;
        }

        .btn-filter-action.apply {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-filter-action.apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5);
        }

        .btn-filter-action.reset {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-filter-action.reset:hover {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.4);
            color: var(--primary);
        }

        /* ===== Results Bar ===== */
        .results-count-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .results-count {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .results-count i { color: var(--primary); }

        .results-count span {
            color: var(--secondary);
            font-weight: 700;
            font-size: 18px;
            text-shadow: 0 0 12px rgba(255, 217, 61, 0.4);
        }

        /* ===== Active Filter Chips ===== */
        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px 5px 12px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(108, 92, 231, 0.15));
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            animation: chipFadeIn 0.3s;
        }

        @keyframes chipFadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .filter-chip button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: 0.2s;
        }

        .filter-chip button:hover {
            background: rgba(255, 107, 107, 0.4);
            color: white;
        }

        /* ===== Products ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardSlideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        @keyframes cardSlideUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.4);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35), 0 0 30px rgba(255, 107, 107, 0.18);
        }

        .product-card .product-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .product-card .product-cat {
            display: inline-block;
            background: rgba(108, 92, 231, 0.15);
            color: #a29bfe;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            margin-right: 6px;
            margin-bottom: 10px;
        }

        .product-card h4 {
            font-size: 16px;
            margin-bottom: 6px;
            min-height: 44px;
            transition: 0.3s;
        }

        .product-card:hover h4 { color: var(--secondary); }

        .product-card h4 i {
            color: var(--primary);
            margin-left: 6px;
            font-size: 13px;
        }

        .product-card .product-rating {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .product-card .product-rating .stars {
            display: inline-flex;
            gap: 2px;
            color: #ffd93d;
            font-size: 11px;
        }

        .product-card .product-rating .stars .empty { color: rgba(255, 255, 255, 0.15); }

        .product-card .price {
            font-size: 20px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 8px;
            text-shadow: 0 0 12px rgba(255, 217, 61, 0.3);
        }

        .product-card .price i {
            font-size: 14px;
            margin-left: 6px;
        }

        .product-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: stretch;
        }

        .product-card .btn-sm {
            padding: 8px 16px;
            border: none;
            border-radius: 30px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .product-card .btn-cart {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .product-card .btn-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.5);
        }

        .product-card .btn-details {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 46px;
            flex: 0 0 46px;
        }

        .product-card .btn-details:hover {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-color: transparent;
        }

        .btn-compare-toggle {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            position: relative;
            flex-shrink: 0;
        }

        .btn-compare-toggle:hover {
            background: rgba(108, 92, 231, 0.2);
            border-color: rgba(108, 92, 231, 0.5);
            color: #a29bfe;
            transform: translateY(-2px);
        }

        .btn-compare-toggle.active {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.5);
        }

        .btn-compare-toggle.active::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: -4px;
            left: -4px;
            background: #22c55e;
            color: white;
            font-size: 9px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 2px solid #0a0a1a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 18px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .empty-state h3 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        /* Load More */
        .load-more-section {
            margin-top: 40px;
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
        }

        .load-more-info {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .load-more-info strong {
            color: var(--secondary);
            font-weight: 800;
            font-size: 16px;
        }

        .load-more-progress {
            width: 100%;
            max-width: 400px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .load-more-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }

        .btn-load-more {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.35);
            transition: 0.3s;
            min-width: 220px;
        }

        .btn-load-more:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.55);
        }

        .btn-load-more:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-load-more.loading i {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-more-products {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 50px;
            color: #22c55e;
            font-size: 14px;
            font-weight: 700;
        }

        .no-more-products i { font-size: 18px; }

        .load-more-section.hidden { display: none; }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .page-header h1 { font-size: 28px; }
            .page-header p { font-size: 15px; }
            .main-content { padding: 25px 15px; }
            .toolbar { padding: 12px 14px; gap: 8px; }
            .toolbar .search-box { min-width: 100%; order: 1; }
            .toolbar select { flex: 1; min-width: 0; order: 2; }
            .btn-filters-toggle { flex: 1; justify-content: center; order: 3; }

            .filters-panel { padding: 0 16px; border-radius: 16px; }
            .filters-panel.open { padding: 16px; }

            .filters-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .filter-block { padding: 14px; }

            .filters-footer {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-footer .actions {
                width: 100%;
            }

            .btn-filter-action { flex: 1; justify-content: center; }

            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .product-card { padding: 14px; }
            .product-card h4 { font-size: 14px; min-height: 40px; }
            .product-card .price { font-size: 17px; }

            .product-card .card-actions {
                flex-wrap: wrap;
            }

            .product-card .btn-cart {
                flex: 1 1 100%;
                order: 1;
            }

            .product-card .btn-details,
            .product-card .btn-compare-toggle {
                flex: 0 0 44px;
                max-width: 44px;
                min-width: 44px;
                height: 44px;
                order: 2;
            }

            .back-to-top {
                bottom: 90px !important;
                left: 15px !important;
            }
        }

        @media (max-width: 640px) {
            .btn-load-more {
                width: 100%;
                padding: 13px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 500px) {
            .product-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 22px; }
            .chip-option span { font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="main-content">

        <a href="../index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            العودة للرئيسية
        </a>

        <div class="page-header">
            <h1>🛍️ جميع المنتجات</h1>
            <p>تصفح منتجاتنا المميزة واختر ما يناسبك</p>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
            </div>

            <select id="sortFilter">
                <option value="default">الترتيب الافتراضي</option>
                <option value="price_asc">الأقل سعراً</option>
                <option value="price_desc">الأعلى سعراً</option>
                <option value="rating_desc">الأعلى تقييماً</option>
                <option value="name_asc">الاسم A-Z</option>
                <option value="name_desc">الاسم Z-A</option>
            </select>

            <button class="btn-filters-toggle" id="filtersToggle">
                <i class="fas fa-sliders-h"></i>
                <span>الفلاتر</span>
                <span class="filter-count" id="filterCount">0</span>
                <i class="fas fa-chevron-down chevron"></i>
            </button>
        </div>

        <!-- ✅ Filters Panel (Dropdown) -->
        <div class="filters-panel" id="filtersPanel">
            <div class="filters-grid">

                <!-- Price -->
                <div class="filter-block">
                    <div class="filter-block-title">
                        <i class="fas fa-tag"></i>
                        السعر (ج.م)
                    </div>
                    <div class="price-inputs">
                        <input type="number" id="priceMin" placeholder="من" min="0">
                        <span class="dash">—</span>
                        <input type="number" id="priceMax" placeholder="إلى" min="0">
                    </div>
                </div>

                <!-- Category -->
                <div class="filter-block">
                    <div class="filter-block-title">
                        <i class="fas fa-tags"></i>
                        التصنيف
                    </div>
                    <div class="categories-list" id="categoriesList">
                        <p style="color:rgba(255,255,255,0.4);font-size:13px;">جاري التحميل...</p>
                    </div>
                </div>

                <!-- Availability -->
                <div class="filter-block">
                    <div class="filter-block-title">
                        <i class="fas fa-check-circle"></i>
                        التوفر
                    </div>
                    <div class="chip-options" id="availabilityList">
                        <label class="chip-option">
                            <input type="radio" name="availability" value="all" checked>
                            <span>الكل</span>
                        </label>
                        <label class="chip-option">
                            <input type="radio" name="availability" value="available">
                            <span>✅ متوفر</span>
                        </label>
                        <label class="chip-option">
                            <input type="radio" name="availability" value="out">
                            <span>❌ غير متوفر</span>
                        </label>
                    </div>
                </div>

                <!-- Rating -->
                <div class="filter-block">
                    <div class="filter-block-title">
                        <i class="fas fa-star"></i>
                        التقييم
                    </div>
                    <div class="chip-options" id="ratingList">
                        <label class="chip-option">
                            <input type="radio" name="rating" value="0" checked>
                            <span>الكل</span>
                        </label>
                        <label class="chip-option">
                            <input type="radio" name="rating" value="4">
                            <span>4+ <span class="stars">★★★★</span></span>
                        </label>
                        <label class="chip-option">
                            <input type="radio" name="rating" value="3">
                            <span>3+ <span class="stars">★★★</span></span>
                        </label>
                        <label class="chip-option">
                            <input type="radio" name="rating" value="2">
                            <span>2+ <span class="stars">★★</span></span>
                        </label>
                    </div>
                </div>

            </div>

            <!-- Filters Footer -->
            <div class="filters-footer">
                <div class="result-hint">
                    <i class="fas fa-box"></i>
                    <span>النتائج: <strong id="panelResultCount">0</strong></span>
                </div>
                <div class="actions">
                    <button type="button" class="btn-filter-action reset" id="resetFiltersBtn">
                        <i class="fas fa-times-circle"></i>
                        مسح الكل
                    </button>
                    <button type="button" class="btn-filter-action apply" id="applyFiltersBtn">
                        <i class="fas fa-check"></i>
                        تطبيق
                    </button>
                </div>
            </div>
        </div>

        <!-- Results bar -->
        <div class="results-count-bar">
            <div class="results-count">
                <i class="fas fa-box"></i>
                <span id="resultCount">0</span> منتج
            </div>
        </div>

        <!-- Active chips -->
        <div class="active-filters" id="activeFilters"></div>

        <!-- Products -->
        <div id="productsContainer">
            <div class="skeleton-product-grid">
                <div class="skeleton-product-card">
                    <div class="skeleton skeleton-badge"></div>
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-price"></div>
                    <div class="skeleton skeleton-button"></div>
                </div>
                <div class="skeleton-product-card">
                    <div class="skeleton skeleton-badge"></div>
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-price"></div>
                    <div class="skeleton skeleton-button"></div>
                </div>
                <div class="skeleton-product-card">
                    <div class="skeleton skeleton-badge"></div>
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-price"></div>
                    <div class="skeleton skeleton-button"></div>
                </div>
                <div class="skeleton-product-card">
                    <div class="skeleton skeleton-badge"></div>
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-price"></div>
                    <div class="skeleton skeleton-button"></div>
                </div>
            </div>
        </div>

        <!-- Load more -->
        <div class="load-more-section hidden" id="loadMoreSection">
            <div class="load-more-info">
                <span>عرض <strong id="showingCount">0</strong> من <strong id="totalCount">0</strong> منتج</span>
            </div>
            <div class="load-more-progress">
                <div class="load-more-progress-bar" id="loadMoreProgress"></div>
            </div>
            <button class="btn-load-more" id="loadMoreBtn">
                <i class="fas fa-plus-circle"></i>
                <span>عرض المزيد</span>
            </button>
            <div class="no-more-products" id="noMoreProducts" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span>عرضت كل المنتجات</span>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 100 });
    </script>

    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/compare.js"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../shared/footer.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            const productsContainer = document.getElementById('productsContainer');
            const searchInput = document.getElementById('searchInput');
            const sortFilter = document.getElementById('sortFilter');
            const resultCount = document.getElementById('resultCount');
            const panelResultCount = document.getElementById('panelResultCount');
            const priceMin = document.getElementById('priceMin');
            const priceMax = document.getElementById('priceMax');
            const categoriesList = document.getElementById('categoriesList');
            const availabilityList = document.getElementById('availabilityList');
            const ratingList = document.getElementById('ratingList');
            const activeFilters = document.getElementById('activeFilters');
            const filtersToggle = document.getElementById('filtersToggle');
            const filtersPanel = document.getElementById('filtersPanel');
            const filterCount = document.getElementById('filterCount');
            const applyFiltersBtn = document.getElementById('applyFiltersBtn');
            const resetFiltersBtn = document.getElementById('resetFiltersBtn');

            const loadMoreSection = document.getElementById('loadMoreSection');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const loadMoreProgress = document.getElementById('loadMoreProgress');
            const showingCount = document.getElementById('showingCount');
            const totalCount = document.getElementById('totalCount');
            const noMoreProducts = document.getElementById('noMoreProducts');

            let allProducts = [];
            let filteredProducts = [];
            let categories = [];
            let categoryMap = {};
            let statusValues = new Set();

            const ITEMS_PER_PAGE = window.innerWidth <= 768 ? 8 : 12;
            let currentPage = 0;

            function safeToString(v) {
                return (v === null || v === undefined) ? '' : String(v);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function isAvailable(status) {
                if (status === null || status === undefined) return true;
                const s = String(status).toLowerCase().trim();
                return !(
                    s === 'out of stock' || s === 'out_of_stock' || s === 'outofstock' ||
                    s === 'unavailable' || s === 'غير متوفر' || s === 'نفذ' ||
                    s === 'نفذت' || s === 'false' || s === '0' || s === 'no'
                );
            }

            function updateLoadMoreUI() {
                const total = filteredProducts.length;
                const shown = Math.min((currentPage + 1) * ITEMS_PER_PAGE, total);

                if (showingCount) showingCount.textContent = shown;
                if (totalCount) totalCount.textContent = total;

                if (loadMoreProgress) {
                    const percent = total > 0 ? (shown / total) * 100 : 0;
                    loadMoreProgress.style.width = percent + '%';
                }

                if (shown >= total) {
                    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
                    if (noMoreProducts) noMoreProducts.style.display = 'inline-flex';
                } else {
                    if (loadMoreBtn) loadMoreBtn.style.display = 'inline-flex';
                    if (noMoreProducts) noMoreProducts.style.display = 'none';
                }

                if (loadMoreSection) {
                    loadMoreSection.classList.toggle('hidden', total === 0);
                }
            }

            function renderCategories() {
                if (categories.length === 0) {
                    categoriesList.innerHTML = '<p style="color:rgba(255,255,255,0.4);font-size:13px;">لا توجد تصنيفات</p>';
                    return;
                }

                const counts = {};
                allProducts.forEach(p => {
                    const cid = safeToString(p.Category_ID);
                    if (cid) counts[cid] = (counts[cid] || 0) + 1;
                });

                categoriesList.innerHTML = '';
                categories.forEach(cat => {
                    const cid = safeToString(cat.Category_ID);
                    const cname = safeToString(cat.Category_Name) || 'بدون اسم';
                    const count = counts[cid] || 0;

                    const label = document.createElement('label');
                    label.className = 'cat-checkbox';
                    label.innerHTML = `
                        <input type="checkbox" value="${escapeHtml(cid)}" data-filter="category">
                        <span class="checkmark"><i class="fas fa-check"></i></span>
                        <span>${escapeHtml(cname)}</span>
                        <span class="cat-count">${count}</span>
                    `;
                    categoriesList.appendChild(label);
                });
            }

            function getActiveFilters() {
                const minPrice = parseFloat(priceMin.value) || 0;
                const maxPrice = parseFloat(priceMax.value) || Infinity;

                const selectedCats = Array.from(
                    document.querySelectorAll('input[data-filter="category"]:checked')
                ).map(cb => cb.value);

                const availability = document.querySelector('input[name="availability"]:checked')?.value || 'all';
                const minRating = parseFloat(document.querySelector('input[name="rating"]:checked')?.value || '0');

                return { minPrice, maxPrice, selectedCats, availability, minRating };
            }

            function countActiveFilters() {
                let count = 0;
                const minP = parseFloat(priceMin.value);
                const maxP = parseFloat(priceMax.value);
                if (!isNaN(minP) || !isNaN(maxP)) count++;

                const cats = document.querySelectorAll('input[data-filter="category"]:checked').length;
                if (cats > 0) count++;

                const avail = document.querySelector('input[name="availability"]:checked')?.value;
                if (avail && avail !== 'all') count++;

                const rating = parseFloat(document.querySelector('input[name="rating"]:checked')?.value || '0');
                if (rating > 0) count++;

                return count;
            }

            function renderActiveChips() {
                activeFilters.innerHTML = '';
                const { minPrice, maxPrice, selectedCats, availability, minRating } = getActiveFilters();
                const chips = [];

                if (minPrice > 0 || maxPrice < Infinity) {
                    const minTxt = minPrice > 0 ? minPrice.toLocaleString() : '0';
                    const maxTxt = maxPrice < Infinity ? maxPrice.toLocaleString() : '∞';
                    chips.push({
                        label: `💰 ${minTxt} - ${maxTxt} ج.م`,
                        clear: () => { priceMin.value = ''; priceMax.value = ''; }
                    });
                }

                selectedCats.forEach(cid => {
                    const cname = categoryMap[cid] || cid;
                    chips.push({
                        label: `📂 ${cname}`,
                        clear: () => {
                            const cb = document.querySelector(`input[data-filter="category"][value="${cid}"]`);
                            if (cb) cb.checked = false;
                        }
                    });
                });

                if (availability !== 'all') {
                    chips.push({
                        label: availability === 'available' ? '✅ متوفر' : '❌ غير متوفر',
                        clear: () => {
                            const r = document.querySelector('input[name="availability"][value="all"]');
                            if (r) r.checked = true;
                        }
                    });
                }

                if (minRating > 0) {
                    chips.push({
                        label: `⭐ ${minRating}+ نجوم`,
                        clear: () => {
                            const r = document.querySelector('input[name="rating"][value="0"]');
                            if (r) r.checked = true;
                        }
                    });
                }

                chips.forEach(chip => {
                    const el = document.createElement('div');
                    el.className = 'filter-chip';
                    el.innerHTML = `
                        <span>${escapeHtml(chip.label)}</span>
                        <button type="button" aria-label="إزالة">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    el.querySelector('button').addEventListener('click', () => {
                        chip.clear();
                        applyFilters();
                    });
                    activeFilters.appendChild(el);
                });

                const count = countActiveFilters();
                filterCount.textContent = count;
                filtersToggle.classList.toggle('has-filters', count > 0);
            }

            function createProductCard(item, index) {
                const productId = safeToString(item.Product_ID);
                const productName = safeToString(item.Product_Name) || 'بدون اسم';
                const price = parseFloat(item.Selling_Price) || 0;
                const imageUrl = item.Image_URL || '';
                const rating = parseFloat(item.Rating) || 0;
                const reviewCount = parseInt(item.Review_Count) || 0;
                const catId = safeToString(item.Category_ID);
                const catName = categoryMap[catId] || '';

                const icons = ['fa-tag', 'fa-box', 'fa-cube', 'fa-gem', 'fa-star', 'fa-crown'];
                const icon = icons[index % icons.length];

                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${(index % ITEMS_PER_PAGE) * 0.05}s`;

                const badge = document.createElement('div');
                badge.className = 'product-id-badge';
                badge.innerHTML = `<i class="fas fa-barcode"></i> ${escapeHtml(productId)}`;

                const catBadge = document.createElement('div');
                catBadge.className = 'product-cat';
                catBadge.innerHTML = `<i class="fas fa-tag"></i> ${escapeHtml(catName || '—')}`;

                const title = document.createElement('h4');
                title.innerHTML = `<i class="fas ${icon}"></i> ${escapeHtml(productName)}`;

                const ratingEl = document.createElement('div');
                ratingEl.className = 'product-rating';
                const fullStars = Math.round(rating);
                let starsHTML = '';
                for (let i = 1; i <= 5; i++) {
                    starsHTML += i <= fullStars
                        ? '<i class="fas fa-star"></i>'
                        : '<i class="fas fa-star empty"></i>';
                }
                ratingEl.innerHTML = `
                    <span class="stars">${starsHTML}</span>
                    <span>${rating.toFixed(1)} (${reviewCount})</span>
                `;

                const priceEl = document.createElement('div');
                priceEl.className = 'price';
                priceEl.innerHTML = `
                    <i class="fas fa-tag"></i>
                    ${price > 0 ? Number(price).toLocaleString('en-US') + ' ج.م' : '—'}
                `;

                const actions = document.createElement('div');
                actions.className = 'card-actions';

                const cartBtn = document.createElement('button');
                cartBtn.className = 'btn-sm btn-cart';
                cartBtn.innerHTML = `<i class="fas fa-cart-plus"></i> أضف`;
                cartBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.disabled) return;
                    this.disabled = true;
                    window.addToCartItem(productId, productName, price, imageUrl);
                    setTimeout(() => { this.disabled = false; }, 500);
                });

                const detailsBtn = document.createElement('button');
                detailsBtn.className = 'btn-sm btn-details';
                detailsBtn.innerHTML = `<i class="fas fa-eye"></i>`;
                detailsBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.location.href = `product-details.html?id=${encodeURIComponent(productId)}`;
                });

                const compareBtn = document.createElement('button');
                compareBtn.className = 'btn-compare-toggle';
                compareBtn.setAttribute('aria-label', 'أضف للمقارنة');
                compareBtn.innerHTML = `<i class="fas fa-balance-scale"></i>`;
                if (window.isInCompare && window.isInCompare(productId)) {
                    compareBtn.classList.add('active');
                }
                compareBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (window.toggleCompare) {
                        const added = window.toggleCompare({
                            id: productId,
                            name: productName,
                            price: price,
                            image: imageUrl
                        });
                        this.classList.toggle('active', added);
                    }
                });

                actions.appendChild(cartBtn);
                actions.appendChild(detailsBtn);
                actions.appendChild(compareBtn);

                card.appendChild(badge);
                card.appendChild(catBadge);
                card.appendChild(title);
                card.appendChild(ratingEl);
                card.appendChild(priceEl);
                card.appendChild(actions);

                card.addEventListener('click', () => {
                    window.location.href = `product-details.html?id=${encodeURIComponent(productId)}`;
                });

                return card;
            }

            function renderProducts(resetPage = true) {
                if (!filteredProducts || filteredProducts.length === 0) {
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search-minus"></i>
                            <h3>مفيش منتجات مطابقة</h3>
                            <p>جرب تغير الفلاتر أو ابحث بكلمة تانية</p>
                        </div>
                    `;
                    resultCount.textContent = '0';
                    if (panelResultCount) panelResultCount.textContent = '0';
                    if (loadMoreSection) loadMoreSection.classList.add('hidden');
                    return;
                }

                if (resetPage) currentPage = 0;

                const totalToShow = Math.min((currentPage + 1) * ITEMS_PER_PAGE, filteredProducts.length);
                const productsToShow = filteredProducts.slice(0, totalToShow);

                resultCount.textContent = filteredProducts.length;
                if (panelResultCount) panelResultCount.textContent = filteredProducts.length;

                const grid = document.createElement('div');
                grid.className = 'product-grid';

                productsToShow.forEach((item, index) => {
                    grid.appendChild(createProductCard(item, index));
                });

                productsContainer.innerHTML = '';
                productsContainer.appendChild(grid);

                updateLoadMoreUI();

                if (window.AOS && typeof AOS.refresh === 'function') {
                    AOS.refresh();
                }
            }

            function loadMore() {
                const total = filteredProducts.length;
                const shown = Math.min((currentPage + 1) * ITEMS_PER_PAGE, total);

                if (shown >= total) return;

                if (loadMoreBtn) {
                    loadMoreBtn.disabled = true;
                    loadMoreBtn.classList.add('loading');
                    loadMoreBtn.innerHTML = '<i class="fas fa-spinner"></i><span>جاري التحميل...</span>';
                }

                setTimeout(() => {
                    currentPage++;
                    renderProducts(false);

                    if (loadMoreBtn) {
                        loadMoreBtn.disabled = false;
                        loadMoreBtn.classList.remove('loading');
                        loadMoreBtn.innerHTML = '<i class="fas fa-plus-circle"></i><span>عرض المزيد</span>';
                    }
                }, 300);
            }

            function applyFilters() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const sortValue = sortFilter.value;
                const { minPrice, maxPrice, selectedCats, availability, minRating } = getActiveFilters();

                let filtered = allProducts.filter(item => {
                    const name = safeToString(item.Product_Name).toLowerCase();
                    const id = safeToString(item.Product_ID).toLowerCase();
                    const matchSearch = !searchTerm || name.includes(searchTerm) || id.includes(searchTerm);

                    const price = parseFloat(item.Selling_Price) || 0;
                    const matchPrice = price >= minPrice && price <= maxPrice;

                    const catId = safeToString(item.Category_ID);
                    const matchCat = selectedCats.length === 0 || selectedCats.includes(catId);

                    const available = isAvailable(item.Status);
                    let matchAvail = true;
                    if (availability === 'available') matchAvail = available;
                    else if (availability === 'out') matchAvail = !available;

                    const rating = parseFloat(item.Rating) || 0;
                    const matchRating = rating >= minRating;

                    return matchSearch && matchPrice && matchCat && matchAvail && matchRating;
                });

                switch (sortValue) {
                    case 'price_asc':
                        filtered.sort((a, b) => (parseFloat(a.Selling_Price) || 0) - (parseFloat(b.Selling_Price) || 0));
                        break;
                    case 'price_desc':
                        filtered.sort((a, b) => (parseFloat(b.Selling_Price) || 0) - (parseFloat(a.Selling_Price) || 0));
                        break;
                    case 'rating_desc':
                        filtered.sort((a, b) => (parseFloat(b.Rating) || 0) - (parseFloat(a.Rating) || 0));
                        break;
                    case 'name_asc':
                        filtered.sort((a, b) => safeToString(a.Product_Name).localeCompare(safeToString(b.Product_Name)));
                        break;
                    case 'name_desc':
                        filtered.sort((a, b) => safeToString(b.Product_Name).localeCompare(safeToString(a.Product_Name)));
                        break;
                }

                filteredProducts = filtered;
                renderProducts(true);
                renderActiveChips();
            }

            async function loadData() {
                try {
                    const { data: cats, error: catErr } = await supabase
                        .from('Category')
                        .select('Category_ID, Category_Name')
                        .limit(200);

                    if (!catErr && cats) {
                        categories = cats;
                        categoryMap = {};
                        cats.forEach(c => {
                            categoryMap[safeToString(c.Category_ID)] = safeToString(c.Category_Name);
                        });
                    }

                    const { data: prods, error: prodErr } = await supabase
                        .from('Product')
                        .select('Product_ID, Product_Name, Selling_Price, Image_URL, Category_ID, Status, Rating, Review_Count');

                    if (prodErr) throw prodErr;

                    allProducts = prods || [];

                    statusValues = new Set(allProducts.map(p => p.Status).filter(s => s != null));
                    console.log('📊 Status values:', [...statusValues]);

                    renderCategories();

                    filteredProducts = [...allProducts];
                    applyFilters();

                    console.log('✅ Loaded:', allProducts.length, 'products');

                } catch (err) {
                    console.error('❌ Error:', err);
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i>
                            <h3 style="color:#ff6b6b;">${escapeHtml(err.message)}</h3>
                        </div>
                    `;
                }
            }

            // ===== Events =====
            searchInput.addEventListener('input', applyFilters);
            sortFilter.addEventListener('change', applyFilters);
            priceMin.addEventListener('input', applyFilters);
            priceMax.addEventListener('input', applyFilters);
            availabilityList.addEventListener('change', applyFilters);
            ratingList.addEventListener('change', applyFilters);
            categoriesList.addEventListener('change', applyFilters);

            // Toggle filters panel
            filtersToggle.addEventListener('click', () => {
                const isOpen = filtersPanel.classList.contains('open');
                filtersPanel.classList.toggle('open', !isOpen);
                filtersToggle.classList.toggle('active', !isOpen);
            });

            // Apply button
            if (applyFiltersBtn) {
                applyFiltersBtn.addEventListener('click', () => {
                    applyFilters();
                    filtersPanel.classList.remove('open');
                    filtersToggle.classList.remove('active');
                    if (window.showToast) window.showToast('تم تطبيق الفلاتر', 'success');
                });
            }

            // Reset button
            if (resetFiltersBtn) {
                resetFiltersBtn.addEventListener('click', () => {
                    searchInput.value = '';
                    sortFilter.value = 'default';
                    priceMin.value = '';
                    priceMax.value = '';
                    document.querySelectorAll('input[data-filter="category"]:checked').forEach(cb => cb.checked = false);
                    const allAvail = document.querySelector('input[name="availability"][value="all"]');
                    if (allAvail) allAvail.checked = true;
                    const allRating = document.querySelector('input[name="rating"][value="0"]');
                    if (allRating) allRating.checked = true;
                    applyFilters();
                    if (window.showToast) window.showToast('تم مسح الفلاتر', 'info');
                });
            }

            if (loadMoreBtn) {
                loadMoreBtn.addEventListener('click', loadMore);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q');
            if (initialQuery && searchInput) {
                searchInput.value = initialQuery;
            }

            loadData();

            console.log('%c🛍️ Products page with dropdown filters loaded', 'color: #ff6b6b; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
</html>
