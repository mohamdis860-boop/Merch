<!-- ==================== products.html (نسخة معدلة مع دعم السلة) ==================== -->
<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات - متجرنا</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Animated Colorful Background ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation .blob:nth-child(2) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation-delay: -7s;
        }

        .bg-animation .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -14s;
        }

        .bg-animation .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%;
            right: 20%;
            animation-delay: -4s;
        }

        .bg-animation .blob:nth-child(5) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%;
            left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* ===== Navbar ===== */
        .navbar {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 26, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            animation: slideDown 0.7s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .navbar .logo {
            font-size: 28px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            text-decoration: none;
            transition: 0.4s;
        }

        .navbar .logo:hover {
            transform: scale(1.05);
        }

        .navbar .logo i {
            color: var(--primary);
            font-size: 32px;
            animation: logoPulse 2.5s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255, 107, 107, 0.5)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 18px rgba(255, 107, 107, 0.9)); }
        }

        .navbar .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .navbar .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.35s;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            padding: 4px 0;
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.35s ease;
            border-radius: 2px;
        }

        .navbar .nav-links a:hover::after,
        .navbar .nav-links a.active::after {
            width: 100%;
        }

        .navbar .nav-links a:hover {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .navbar .nav-links a.active {
            color: var(--primary);
        }

        /* ===== عداد السلة ===== */
        .cart-badge {
            position: relative;
        }

        .cart-badge .badge-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: linear-gradient(135deg, var(--primary), #ee5a24);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.5);
            animation: badgePop 0.4s ease-out;
        }

        @keyframes badgePop {
            0% { transform: scale(0); }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* ===== Main Content ===== */
        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 30px;
            animation: fadeInLeft 0.7s ease-out;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(-6px);
        }

        .back-btn i {
            transition: 0.35s;
        }

        .back-btn:hover i {
            transform: translateX(-4px);
        }

        /* ===== Page Header ===== */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.9s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        /* ===== Filter Section ===== */
        .filter-section {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 35px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            animation: fadeInUp 0.9s ease-out 0.3s both;
            position: relative;
            overflow: hidden;
        }

        .filter-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.04), transparent, rgba(108, 92, 231, 0.04), transparent);
            animation: rotateGlow 15s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .filter-section .search-box {
            flex: 1;
            min-width: 250px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50px;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s;
            position: relative;
            z-index: 1;
        }

        .filter-section .search-box:focus-within {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.25);
            transform: scale(1.02);
        }

        .filter-section .search-box i {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            transition: 0.35s;
        }

        .filter-section .search-box:focus-within i {
            color: var(--primary);
            transform: scale(1.15);
        }

        .filter-section .search-box input {
            background: transparent;
            border: none;
            padding: 14px 15px;
            color: white;
            font-size: 16px;
            width: 100%;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .filter-section .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .filter-section .filter-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .filter-section .filter-options select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            outline: none;
            min-width: 150px;
            transition: 0.4s;
        }

        .filter-section .filter-options select:hover,
        .filter-section .filter-options select:focus {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.1);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);
        }

        .filter-section .filter-options select option {
            background: #1a1a2e;
            color: white;
        }

        .filter-section .results-count {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-right: auto;
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-section .results-count i {
            color: var(--primary);
        }

        .filter-section .results-count span {
            color: var(--secondary);
            font-weight: 700;
            font-size: 18px;
            text-shadow: 0 0 12px rgba(255, 217, 61, 0.4);
        }

        /* ===== Product Grid ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardPopIn 0.55s ease-out both;
            position: relative;
            overflow: hidden;
        }

        @keyframes cardPopIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); }
            70% { transform: translateY(-5px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.06), transparent, rgba(108, 92, 231, 0.06), transparent);
            animation: rotateGlow 12s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.35);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.35), 0 0 35px rgba(255, 107, 107, 0.15);
        }

        .product-card .product-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
            transition: 0.4s;
            position: relative;
            z-index: 1;
        }

        .product-card:hover .product-id-badge {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        .product-card h4 {
            font-size: 18px;
            margin-bottom: 8px;
            min-height: 50px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }

        .product-card:hover h4 {
            color: var(--secondary);
        }

        .product-card h4 i {
            color: var(--primary);
            margin-left: 8px;
            font-size: 14px;
            transition: 0.4s;
        }

        .product-card:hover h4 i {
            transform: rotate(15deg) scale(1.2);
            color: var(--secondary);
        }

        .product-card .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 10px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
            text-shadow: 0 0 15px rgba(255, 217, 61, 0.3);
        }

        .product-card:hover .price {
            text-shadow: 0 0 25px rgba(255, 217, 61, 0.7);
            transform: scale(1.05);
        }

        .product-card .price i {
            font-size: 16px;
            margin-right: 6px;
        }

        .product-card .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .product-card .card-actions .btn-sm {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .product-card .card-actions .btn-cart {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            position: relative;
            overflow: hidden;
        }

        .product-card .card-actions .btn-cart::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .product-card .card-actions .btn-cart:hover::after {
            left: 100%;
        }

        .product-card .card-actions .btn-cart:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .product-card .card-actions .btn-details {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 50px;
        }

        .product-card .card-actions .btn-details:hover {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
            border-color: transparent;
        }

        /* ===== Loading Spinner ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            gap: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            animation: fadeInUp 0.6s ease-out;
        }

        .loading-spinner i {
            animation: spin 1s linear infinite;
            font-size: 32px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.6));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
            animation: fadeInUp 0.6s ease-out;
        }

        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* ===== Footer ===== */
        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            40% { transform: scale(1); }
            60% { transform: scale(1.2); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 28px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            z-index: 100;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            color: #6bcb77;
            font-size: 22px;
            animation: toastIconPop 0.5s ease-out;
        }

        @keyframes toastIconPop {
            0% { transform: scale(0) rotate(-90deg); }
            70% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }
            .navbar .logo {
                font-size: 22px;
            }
            .navbar .nav-links {
                gap: 12px;
            }
            .navbar .nav-links a {
                font-size: 13px;
            }
            .page-header h1 {
                font-size: 30px;
            }
            .main-content {
                padding: 30px 15px;
            }
            .filter-section {
                padding: 20px;
                flex-direction: column;
            }
            .filter-section .search-box {
                width: 100%;
                min-width: unset;
            }
            .filter-section .filter-options {
                width: 100%;
            }
            .filter-section .filter-options select {
                flex: 1;
                min-width: 120px;
            }
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }
            .toast {
                bottom: 20px;
                right: 20px;
                left: 20px;
                padding: 14px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 500px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .filter-section .filter-options select {
                min-width: 100%;
            }
            .page-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Colorful Background -->
    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="fas fa-store"></i>
            متجرنا
        </a>
        <div class="nav-links">
            <a href="../index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="products.html" class="active"><i class="fas fa-box"></i> المنتجات</a>
            <a href="categories.html"><i class="fas fa-tags"></i> التصنيفات</a>
            <a href="about.html"><i class="fas fa-info-circle"></i> تعرف علينا</a>
            <a href="cart.html" class="cart-badge">
                <i class="fas fa-shopping-cart"></i> السلة
                <span class="badge-count" id="cartBadge">0</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">

        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            العودة للرئيسية
        </a>

        <div class="page-header">
            <h1>🛍️ جميع المنتجات</h1>
            <p>تصفح منتجاتنا المميزة واختر ما يناسبك</p>
        </div>

        <div class="filter-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
            </div>
            <div class="filter-options">
                <select id="sortFilter">
                    <option value="default">الترتيب الافتراضي</option>
                    <option value="price_asc">السعر: من الأقل للأعلى</option>
                    <option value="price_desc">السعر: من الأعلى للأقل</option>
                    <option value="name_asc">الاسم: من أ إلى ي</option>
                    <option value="name_desc">الاسم: من ي إلى أ</option>
                </select>
            </div>
            <div class="results-count">
                <i class="fas fa-box"></i>
                <span id="resultCount">0</span> منتج
            </div>
        </div>

        <div id="productsContainer">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch"></i>
                جاري تحميل المنتجات...
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">تمت الإضافة</span>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>
            <i class="fas fa-heart"></i>
            جميع الحقوق محفوظة © 2024 متجرنا
        </p>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://cqdgqawjxofbwzcoliut.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxZGdxYXdqeG9mYnd6Y29saXV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNjI2NDgsImV4cCI6MjA3OTYzODY0OH0.0HM9teLT_16Cdx_SwQlNj7QguBcVcdunhJ1kcIPq19s';

            const productsContainer = document.getElementById('productsContainer');
            const searchInput = document.getElementById('searchInput');
            const sortFilter = document.getElementById('sortFilter');
            const resultCount = document.getElementById('resultCount');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const cartBadge = document.getElementById('cartBadge');
            let toastTimeout;

            let allProducts = [];
            let filteredProducts = [];

            // ===== إدارة السلة =====
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            function updateCartBadge() {
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                if (cartBadge) {
                    cartBadge.textContent = totalItems;
                    cartBadge.style.display = totalItems > 0 ? 'flex' : 'none';
                }
            }

            function saveCart() {
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartBadge();
                window.dispatchEvent(new Event('storage'));
            }

            function showToast(message) {
                toastMessage.textContent = message;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ===== دالة إضافة للسلة =====
            window.addToCart = function(productId, productName, price, imageUrl) {
                const existing = cart.find(item => item.id === productId);
                if (existing) {
                    existing.quantity += 1;
                    showToast(`✅ تم زيادة كمية "${productName}"`);
                } else {
                    cart.push({
                        id: productId,
                        name: productName,
                        price: price,
                        image: imageUrl || null,
                        quantity: 1
                    });
                    showToast(`✅ تم إضافة "${productName}" إلى السلة`);
                }
                saveCart();
            };

            window.showProductDetails = function(id, name) {
                showToast(`📦 تفاصيل المنتج: ${name} (${id})`);
            };

            function safeToString(value) {
                if (value === null || value === undefined) return '';
                return String(value);
            }

            async function loadProducts() {
                try {
                    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                    const { data, error } = await supabase
                        .from('Product')
                        .select('Product_ID, Product_Name, Selling_Price, Image_URL');

                    if (error) throw new Error(error.message);

                    console.log('✅ تم تحميل المنتجات:', data);

                    allProducts = data || [];
                    filteredProducts = [...allProducts];
                    updateCartBadge();
                    renderProducts();

                } catch (error) {
                    console.error('❌ خطأ:', error);
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">${error.message}</p>
                        </div>
                    `;
                }
            }

            function renderProducts() {
                console.log('🔄 جاري عرض المنتجات، العدد:', filteredProducts.length);

                if (!filteredProducts || filteredProducts.length === 0) {
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-box-open"></i>
                            <p>لا توجد منتجات تطابق بحثك</p>
                        </div>
                    `;
                    resultCount.textContent = '0';
                    return;
                }

                resultCount.textContent = filteredProducts.length;

                let html = `<div class="product-grid">`;
                const icons = ['fa-tag', 'fa-box', 'fa-cube', 'fa-gem', 'fa-star', 'fa-circle', 'fa-square', 'fa-crown', 'fa-heart', 'fa-fire'];

                filteredProducts.forEach((item, index) => {
                    const productId = safeToString(item.Product_ID);
                    const productName = safeToString(item.Product_Name);
                    const price = parseFloat(item.Selling_Price) || 0;
                    const icon = icons[index % icons.length];
                    const imageUrl = item.Image_URL || '';

                    html += `
                        <div class="product-card" style="animation-delay: ${index * 0.06}s">
                            <div class="product-id-badge">
                                <i class="fas fa-barcode"></i> ${escapeHtml(productId) || '—'}
                            </div>
                            <h4>
                                <i class="fas ${icon}"></i>
                                ${escapeHtml(productName) || 'بدون اسم'}
                            </h4>
                            <div class="price">
                                <i class="fas fa-tag"></i>
                                ${price > 0 ? Number(price).toLocaleString('en-US') + ' ج.م' : '—'}
                            </div>
                            <div class="card-actions">
                                <button class="btn-sm btn-cart" onclick="addToCart('${escapeHtml(productId)}', '${escapeHtml(productName)}', ${price}, '${escapeHtml(imageUrl)}')">
                                    <i class="fas fa-cart-plus"></i> أضف للسلة
                                </button>
                                <button class="btn-sm btn-details" onclick="window.location.href='product-details.html?id=${escapeHtml(productId)}'">
                                <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                productsContainer.innerHTML = html;
            }

            function filterAndSort() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const sortValue = sortFilter.value;

                console.log('🔍 بحث:', searchTerm, '| ترتيب:', sortValue);

                let filtered = allProducts.filter(item => {
                    const name = safeToString(item.Product_Name).toLowerCase();
                    const id = safeToString(item.Product_ID).toLowerCase();
                    return name.includes(searchTerm) || id.includes(searchTerm);
                });

                switch (sortValue) {
                    case 'price_asc':
                        filtered.sort((a, b) => (parseFloat(a.Selling_Price) || 0) - (parseFloat(b.Selling_Price) || 0));
                        break;
                    case 'price_desc':
                        filtered.sort((a, b) => (parseFloat(b.Selling_Price) || 0) - (parseFloat(a.Selling_Price) || 0));
                        break;
                    case 'name_asc':
                        filtered.sort((a, b) => safeToString(a.Product_Name).localeCompare(safeToString(b.Product_Name)));
                        break;
                    case 'name_desc':
                        filtered.sort((a, b) => safeToString(b.Product_Name).localeCompare(safeToString(a.Product_Name)));
                        break;
                    default:
                        break;
                }

                filteredProducts = filtered;
                renderProducts();
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            window.addEventListener('storage', function(e) {
                if (e.key === 'cart') {
                    cart = JSON.parse(e.newValue) || [];
                    updateCartBadge();
                }
            });

            searchInput.addEventListener('input', filterAndSort);
            sortFilter.addEventListener('change', filterAndSort);

            loadProducts();

            console.log('✅ الفلتر والبحث جاهزين');

        })();
    </script>

</body>
</html>
