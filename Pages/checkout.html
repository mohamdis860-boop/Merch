<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ✅ Shared Styles -->
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --success: #6bcb77;
            --error: #ff4757;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-animation {
            position: fixed; inset: 0;
            z-index: 0; overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }
        .bg-animation .blob:nth-child(4) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%; right: 20%;
            animation-delay: -4s;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.35s;
            margin-bottom: 25px;
            animation: fadeInLeft 0.7s ease-out;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(6px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.9s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header .icon-big {
            font-size: 55px;
            color: var(--primary);
            display: block;
            margin-bottom: 12px;
            animation: iconBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5));
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.08); }
        }

        .page-header h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .checkout-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            animation: fadeInUp 0.9s ease-out 0.2s both;
            position: relative;
            overflow: hidden;
        }

        .checkout-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.04), transparent, rgba(108, 92, 231, 0.04), transparent);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 1;
        }

        .card-title i {
            color: var(--primary);
            font-size: 20px;
        }

        .card-title .step-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .form-group label i {
            color: var(--accent);
            margin-right: 4px;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: 0.35s;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            transition: 0.4s;
            user-select: none;
        }

        .payment-option:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        .payment-option.selected {
            background: rgba(255, 107, 107, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);
        }

        .payment-option input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: 0.35s;
            flex-shrink: 0;
        }

        .payment-option input[type="radio"]:checked {
            border-color: var(--primary);
        }

        .payment-option input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .payment-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }

        .payment-option:nth-child(1) .payment-icon {
            background: linear-gradient(135deg, #6bcb77, #4caf50);
        }

        .payment-option:nth-child(2) .payment-icon {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        }

        .payment-option:nth-child(3) .payment-icon {
            background: linear-gradient(135deg, #00cec9, #00b894);
        }

        .payment-text {
            flex: 1;
        }

        .payment-text h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .payment-text p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .summary-sticky {
            position: sticky;
            top: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        .cart-item:last-of-type {
            border-bottom: none;
        }

        .cart-item-image {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-image .no-img {
            color: rgba(255, 255, 255, 0.2);
            font-size: 20px;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-info h5 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-info span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .cart-item-total {
            font-size: 14px;
            font-weight: 700;
            color: var(--secondary);
            flex-shrink: 0;
        }

        .totals {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .total-row.grand-total {
            font-size: 20px;
            font-weight: 800;
            color: white;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .total-row.grand-total .value {
            color: var(--secondary);
            font-size: 24px;
            text-shadow: 0 0 15px rgba(255, 217, 61, 0.4);
        }

        .total-row .value {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
        }

        .confirm-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .confirm-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .confirm-btn:hover::after { left: 100%; }

        .confirm-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .confirm-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-cart i {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .empty-cart h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-cart p {
            font-size: 15px;
            margin-bottom: 25px;
        }

        .empty-cart a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: 0.35s;
        }

        .empty-cart a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.5);
        }

        /* ===== Skeleton: Checkout Layout ===== */
        .skeleton-checkout-layout {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .skeleton-checkout-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            animation: skeletonFadeIn 0.5s ease-out both;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .checkout-layout,
            .skeleton-checkout-layout {
                grid-template-columns: 1fr;
            }
            .summary-sticky {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .main-content { padding: 20px 15px 40px; }
            .page-header h1 { font-size: 26px; }
            .checkout-card,
            .skeleton-checkout-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- ⚠️ الـ Navbar هيتبني تلقائياً -->

    <!-- Main -->
    <div class="main-content">

        <a href="cart.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            العودة للسلة
        </a>

        <div class="page-header">
            <i class="fas fa-credit-card icon-big"></i>
            <h1>إتمام الطلب</h1>
            <p>اختار بياناتك وطريقة الدفع</p>
        </div>

        <!-- ===== Skeleton Loading ===== -->
        <div id="skeletonContainer">
            <div class="skeleton-checkout-layout">
                <!-- Skeleton: Left (Form + Payment) -->
                <div>
                    <!-- Form -->
                    <div class="skeleton-checkout-card">
                        <div class="skeleton" style="width: 180px; height: 22px; margin-bottom: 20px; border-radius: 8px;"></div>
                        <div class="skeleton" style="width: 100%; height: 48px; margin-bottom: 15px; border-radius: 12px;"></div>
                        <div class="skeleton" style="width: 100%; height: 48px; margin-bottom: 15px; border-radius: 12px;"></div>
                        <div class="skeleton" style="width: 100%; height: 48px; margin-bottom: 15px; border-radius: 12px;"></div>
                        <div class="skeleton" style="width: 100%; height: 48px; border-radius: 12px;"></div>
                    </div>

                    <!-- Payment -->
                    <div class="skeleton-checkout-card">
                        <div class="skeleton" style="width: 160px; height: 22px; margin-bottom: 20px; border-radius: 8px;"></div>
                        <div class="skeleton" style="width: 100%; height: 76px; margin-bottom: 12px; border-radius: 14px;"></div>
                        <div class="skeleton" style="width: 100%; height: 76px; margin-bottom: 12px; border-radius: 14px;"></div>
                        <div class="skeleton" style="width: 100%; height: 76px; border-radius: 14px;"></div>
                    </div>
                </div>

                <!-- Skeleton: Right (Summary) -->
                <div>
                    <div class="skeleton-checkout-card">
                        <div class="skeleton" style="width: 140px; height: 22px; margin-bottom: 20px; border-radius: 8px;"></div>

                        <!-- 3 cart items -->
                        <div class="skeleton" style="width: 100%; height: 80px; margin-bottom: 15px; border-radius: 12px;"></div>
                        <div class="skeleton" style="width: 100%; height: 80px; margin-bottom: 15px; border-radius: 12px;"></div>
                        <div class="skeleton" style="width: 100%; height: 80px; margin-bottom: 15px; border-radius: 12px;"></div>

                        <!-- Totals -->
                        <div class="skeleton" style="width: 100%; height: 130px; border-radius: 12px;"></div>

                        <!-- Button -->
                        <div class="skeleton" style="width: 100%; height: 55px; margin-top: 20px; border-radius: 50px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty Cart -->
        <div id="emptyCart" class="empty-cart" style="display: none;">
            <i class="fas fa-shopping-bag"></i>
            <h2>السلة فارغة</h2>
            <p>ضيف منتجات الأول عشان تكمل الطلب</p>
            <a href="products.html">
                <i class="fas fa-shopping-bag"></i>
                ابدأ التسوق
            </a>
        </div>

        <!-- Checkout -->
        <div class="checkout-layout" id="checkoutLayout" style="display: none;">

            <!-- LEFT: Form + Payment -->
            <div>

                <!-- Shipping Info -->
                <div class="checkout-card">
                    <h3 class="card-title">
                        <span class="step-num">1</span>
                        <i class="fas fa-truck"></i>
                        بيانات الشحن
                    </h3>

                    <div class="form-group">
                        <label><i class="fas fa-user"></i> الاسم بالكامل *</label>
                        <input type="text" class="form-input" id="fullName" placeholder="مثال: محمد رضا" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الموبايل *</label>
                        <input type="tel" class="form-input" id="phone" placeholder="01xxxxxxxxx" maxlength="11" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> العنوان بالتفصيل *</label>
                        <input type="text" class="form-input" id="address" placeholder="مثال: شبرا، شارع xxx، عمارة y" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-city"></i> المدينة *</label>
                        <input type="text" class="form-input" id="city" placeholder="مثال: القاهرة" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-comment"></i> ملاحظات (اختياري)</label>
                        <input type="text" class="form-input" id="notes" placeholder="أي ملاحظات إضافية للطلب">
                    </div>
                </div>

                <!-- Payment -->
                <div class="checkout-card">
                    <h3 class="card-title">
                        <span class="step-num">2</span>
                        <i class="fas fa-wallet"></i>
                        طريقة الدفع
                    </h3>

                    <div class="payment-methods">

                        <label class="payment-option selected" data-method="cod">
                            <input type="radio" name="payment" value="cod" checked>
                            <div class="payment-icon">
                                <i class="fas fa-money-bill-wave"></i>
                            </div>
                            <div class="payment-text">
                                <h4>الدفع عند الاستلام</h4>
                                <p>ادفع كاش لما الطلب يوصلك</p>
                            </div>
                        </label>

                        <label class="payment-option" data-method="card">
                            <input type="radio" name="payment" value="card">
                            <div class="payment-icon">
                                <i class="fas fa-credit-card"></i>
                            </div>
                            <div class="payment-text">
                                <h4>بطاقة ائتمان</h4>
                                <p>Visa / Mastercard (قريباً)</p>
                            </div>
                        </label>

                        <label class="payment-option" data-method="wallet">
                            <input type="radio" name="payment" value="wallet">
                            <div class="payment-icon">
                                <i class="fas fa-mobile-alt"></i>
                            </div>
                            <div class="payment-text">
                                <h4>محفظة إلكترونية</h4>
                                <p>فودافون كاش / إتصالات كاش (قريباً)</p>
                            </div>
                        </label>

                    </div>
                </div>

            </div>

            <!-- RIGHT: Summary -->
            <div class="summary-sticky">
                <div class="checkout-card">
                    <h3 class="card-title">
                        <span class="step-num">3</span>
                        <i class="fas fa-shopping-cart"></i>
                        ملخص الطلب
                    </h3>

                    <div id="cartItemsList"></div>

                    <div class="totals">
                        <div class="total-row">
                            <span>المجموع الفرعي</span>
                            <span class="value" id="subtotal">0 ج.م</span>
                        </div>
                        <div class="total-row">
                            <span>الشحن</span>
                            <span class="value" id="shipping">30 ج.م</span>
                        </div>
                        <div class="total-row grand-total">
                            <span>الإجمالي</span>
                            <span class="value" id="grandTotal">0 ج.م</span>
                        </div>
                    </div>

                    <button class="confirm-btn" id="confirmOrderBtn">
                        <i class="fas fa-check-circle"></i>
                        تأكيد الطلب
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- ✅ Shared Scripts -->
    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            const SHIPPING_FEE = 30;

            const skeletonContainer = document.getElementById('skeletonContainer');
            const checkoutLayout = document.getElementById('checkoutLayout');
            const emptyCart = document.getElementById('emptyCart');

            let cart = [];
            let currentUser = null;
            let currentCustomer = null;
            let selectedPayment = 'cod';

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function formatPrice(price) {
                return Number(price || 0).toLocaleString('en-US') + ' ج.م';
            }

            // ===== Init =====
            async function init() {
                try {
                    // 1. Check auth
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        window.showToast('❌ لازم تسجل دخول الأول', 'error');
                        setTimeout(() => {
                            window.location.href = '../Auth/login.html';
                        }, 1500);
                        return;
                    }
                    currentUser = session.user;

                    // 2. Load customer data
                    const { data: customer } = await supabase
                        .from('Customers')
                        .select('*')
                        .eq('id', currentUser.id)
                        .single();

                    currentCustomer = customer || {
                        Name: currentUser.user_metadata?.name || '',
                        Email: currentUser.email,
                        Phone: currentUser.user_metadata?.phone || '',
                        Address: currentUser.user_metadata?.address || '',
                        City: currentUser.user_metadata?.city || ''
                    };

                    // 3. Load cart
                    cart = window.getCart();

                    // 4. Hide skeleton
                    skeletonContainer.style.display = 'none';

                    if (cart.length === 0) {
                        emptyCart.style.display = 'block';
                        checkoutLayout.style.display = 'none';
                        return;
                    }

                    emptyCart.style.display = 'none';
                    checkoutLayout.style.display = 'grid';

                    // 5. Prefill form + render
                    prefillForm();
                    renderSummary();
                    attachEvents();

                } catch (error) {
                    console.error('❌ Init error:', error);
                    skeletonContainer.style.display = 'none';
                    window.showToast('❌ ' + error.message, 'error');
                }
            }

            function prefillForm() {
                document.getElementById('fullName').value = currentCustomer.Name || '';
                document.getElementById('phone').value = currentCustomer.Phone || '';
                document.getElementById('address').value = currentCustomer.Address || '';
                document.getElementById('city').value = currentCustomer.City || '';
            }

            function renderSummary() {
                const itemsList = document.getElementById('cartItemsList');
                let html = '';
                let subtotal = 0;

                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;
                    const imgUrl = window.getImageUrl(item.image);

                    html += `
                        <div class="cart-item">
                            <div class="cart-item-image">
                                ${imgUrl ?
                                    `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(item.name)}">` :
                                    `<i class="fas fa-image no-img"></i>`
                                }
                            </div>
                            <div class="cart-item-info">
                                <h5>${escapeHtml(item.name)}</h5>
                                <span>${item.quantity} × ${formatPrice(item.price)}</span>
                            </div>
                            <div class="cart-item-total">${formatPrice(itemTotal)}</div>
                        </div>
                    `;
                });

                itemsList.innerHTML = html;

                const grandTotal = subtotal + SHIPPING_FEE;
                document.getElementById('subtotal').textContent = formatPrice(subtotal);
                document.getElementById('shipping').textContent = formatPrice(SHIPPING_FEE);
                document.getElementById('grandTotal').textContent = formatPrice(grandTotal);
            }

            function attachEvents() {
                // Payment options
                document.querySelectorAll('.payment-option').forEach(opt => {
                    opt.addEventListener('click', function() {
                        document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                        this.classList.add('selected');
                        const radio = this.querySelector('input[type="radio"]');
                        radio.checked = true;
                        selectedPayment = radio.value;
                    });
                });

                // Phone input: only digits
                document.getElementById('phone').addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });

                // Confirm button
                document.getElementById('confirmOrderBtn').addEventListener('click', confirmOrder);
            }

            async function confirmOrder() {
                // Validate
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const address = document.getElementById('address').value.trim();
                const city = document.getElementById('city').value.trim();

                if (!fullName || !phone || !address || !city) {
                    window.showToast('❌ املأ كل الحقول المطلوبة', 'error');
                    return;
                }

                if (!/^01[0-2,5]{1}[0-9]{8}$/.test(phone)) {
                    window.showToast('❌ رقم الموبايل غير صحيح', 'error');
                    return;
                }

                const btn = document.getElementById('confirmOrderBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري تأكيد الطلب...';

                try {
                    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                    const grandTotal = subtotal + SHIPPING_FEE;

                    const shippingAddress = `${fullName} | ${phone} | ${address} | ${city}`;

                    const orderPayload = {
                        Customer_ID: currentUser.id,
                        Total_Amount: grandTotal,
                        Status: 'pending',
                        Shipping_Address: shippingAddress,
                        Payment_Method: selectedPayment,
                        Payment_Status: 'pending',
                        Order_Date: new Date().toISOString()
                    };

                    console.log('📦 Creating order...', orderPayload);

                    const { data: orderData, error: orderError } = await supabase
                        .from('Order')
                        .insert(orderPayload)
                        .select()
                        .single();

                    if (orderError) throw orderError;

                    console.log('✅ Order created:', orderData);

                    const orderId = orderData.Order_ID || orderData.order_id;

                    // Create Order_Items
                    const itemsPayload = cart.map(item => ({
                        Order_ID: orderId,
                        Product_ID: parseInt(item.id),
                        Quantity: item.quantity,
                        Unit_Price: item.price,
                        Total_Price: item.price * item.quantity
                    }));

                    console.log('📦 Creating order items...', itemsPayload);

                    const { error: itemsError } = await supabase
                        .from('Order_Items')
                        .insert(itemsPayload);

                    if (itemsError) throw itemsError;

                    console.log('✅ Order items created');

                    // Clear cart
                    window.clearCartItems();

                    window.showToast('✅ تم تأكيد طلبك بنجاح!', 'success');

                    setTimeout(() => {
                        window.location.href = '../Auth/profile.html?tab=orders&success=1&order=' + orderId;
                    }, 1500);

                } catch (error) {
                    console.error('❌ Order error:', error);
                    window.showToast('❌ ' + (error.message || 'حصل خطأ في تأكيد الطلب'), 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> تأكيد الطلب';
                }
            }

            init();

            console.log('%c💳 Checkout Page loaded', 'color: #6bcb77; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
</html>
