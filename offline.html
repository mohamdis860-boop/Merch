    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #fff;
            padding: 20px;
            overflow: hidden;
        }

        .offline-container {
            text-align: center;
            max-width: 500px;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(108, 92, 231, 0.15));
            border: 2px dashed rgba(255, 107, 107, 0.4);
            font-size: 3.5rem;
            color: #ff6b6b;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 35px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: 0.3s;
        }

        .btn-retry:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .btn-retry i {
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tips {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            text-align: right;
        }

        .tips h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.9);
        }

        .tips ul {
            list-style: none;
        }

        .tips ul li {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tips ul li i {
            color: #ff6b6b;
            font-size: 0.8rem;
        }
    </style>

<body>

    <div class="offline-container">

        <div class="tips">

            <ul>
                <li><i class="fas fa-check"></i> اتأكد من الواي فاي</li>

                <li><i class="fas fa-check"></i> استنى شوية وجرب تاني</li>
            </ul>
        </div>
    </div>
